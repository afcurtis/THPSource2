; OpenTony hook harness configuration (copied next to THawk2.exe by
; `tony hooks stage`; an existing file is never overwritten).
;
; Precedence: re/config/native_hooks.yml defaults < this file < the
; OPENTONY_HOOKS environment variable (all | none | default | Name | -Name).

[hooks]
; manifest = native where re/native/functions.yml says trace-validated or
; integrated, retail otherwise. `on` / `off` force every hook.
default = manifest
; Per-function overrides, e.g.:
; Math_Vector3Add = off

[runtime]
; Master switch at startup; F9 in game flips it, F10 logs call counts.
native = on
hotkeys = on

[hal]
; Platform HAL (docs/HAL.md): retail keeps the original DirectX/Win32 code;
; sdl replaces the service with the SDL3 backend (needs SDL3.dll next to the
; game). Chosen once at startup; F9 never switches them. input = sdl and
; video = sdl turn window = sdl on. video = sdl draws on the game window (see
; video_backend below) and turns movie = sdl on (the full-screen movies are
; shown through it). audio = sdl plays the game's sound, and Bink's movie and
; music sound, through SDL.
clock = retail
window = retail
input = retail
video = retail
audio = retail
movie = retail
; Which SDL video backend video = sdl uses: auto picks SDL_GPU (Vulkan) if a
; device can be created, else falls back to OpenGL 3.3; gpu forces SDL_GPU
; and fails loudly if it cannot be created; gl forces OpenGL 3.3.
; OPENTONY_VIDEO_BACKEND overrides this for one run.
video_backend = auto
; Start and stop SDL even when every service is retail (toolchain check).
sdl_probe = off

[proxy]
; Forward DirectInput to another dinput.dll proxy instead of the system one,
; e.g. chain = dinput_cumulative.dll
chain =
