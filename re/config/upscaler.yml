# The texture upscaler's downloads (texture-upscaling plan T4; T5 compiles this into the launcher, which fetches the chosen files into Data\Upscaler on
# first use and checks size and SHA-256). Nothing here is shipped: the player's own PC downloads the tool and the models and upscales their own copy's
# textures. Sizes and hashes measured on 2026-11-18 from the URLs below.
#
# `save_as` is the name the pipeline runs the model by (`--model3d NAME` / `--model2d NAME`: Data\Upscaler\models\NAME.param + NAME.bin). Some files are
# published twice under other names: upscayl's upscayl-standard-4x is realesrgan-x4plus byte for byte, digital-art-4x is realesrgan-x4plus-anime,
# upscayl-lite-4x is RealESRGAN_General_x4_v3, high-fidelity-4x is 4xHFA2k (the same SHA-256).
# Candidates only: the person picks the world model and the 2D method in T4.5 (`chosen` below), from the bake-off (scripts/upscale_bakeoff.py).
# OpenModelDB lists no ncnn build of any model (only PyTorch and ONNX), so a model counts only if upscayl or xinntao publish its ncnn conversion:
# 4x-HDCube3 (CC-BY-NC-SA-4.0) and 4x-RealisticRescaler (WTFPL), the plan's game-texture candidates, have none and are out.
# xBRZ (GPL-3.0) and hqx (LGPL) are out: THPSource2 is MIT (LICENSE) and compiles no GPL or LGPL code into its own programs.
version: 1

# The person's pick (T4.5, 2026-11-19): from the contact sheet and from playing sets A and B. UltraSharp's world textures "looked much better"; the anime
# model's HUD looked "overfried", the original pixels at 4x (nearest) looked best. Alpha: the model's edge is smooth on the chains, bicubic's stair-stepped.
chosen:
  world: ultrasharp-4x   # CC-BY-NC-SA-4.0: the player downloads it and upscales their own copy; the launcher shows the licence (T5)
  2d: nearest            # built in, no model
  scale: 4
  alpha: model

tool:
  name: upscayl-bin
  version: "20251207-174704"
  url: https://github.com/upscayl/upscayl-ncnn/releases/download/20251207-174704/upscayl-bin-20251207-174704-windows.zip
  size: 2421760
  sha256: 1f0f65c5d2ade866555e2ac467d35952c35a47080a4060fe56a1ab028f67258a
  member: upscayl-bin-20251207-174704-windows/upscayl-bin.exe   # save as Data\Upscaler\upscayl-bin.exe; LICENSE beside it
  licence: AGPL-3.0
  source: https://github.com/upscayl/upscayl-ncnn
  usage: "-i IN_DIR -o OUT_DIR -m MODELS_DIR -n NAME -s 4 -f png (a whole folder in one process; a fork of xinntao's Real-ESRGAN-ncnn-vulkan)"

