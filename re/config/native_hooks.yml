          original_2000: {address: 0x004f3dd0, expected: "83 ec 08 a1 f0"}}}
      # movie=sdl (src/hooks/hal/movie_hal.cpp): the full-screen movie loop,
      # its frames shown through the movie service.
      - {name: PCMovie_PlayStartupMedia, service: movie, overwrite: 5, builds: {
          canonical: {address: 0x004e5ec0, expected: "8b 44 24 04 83"},
          original_2000: {address: 0x004e3090, expected: "8b 44 24 04 83"}}}
      # audio=sdl (src/hooks/hal/audio_hal.cpp): AudioDevice becomes a
      # stand-in IDirectSound on the HAL audio backend; the rest of
      # pc\soundlib.cpp and Bink's DirectSound output run unchanged on it.
      - {name: Audio_Init, service: audio, overwrite: 5, builds: {
          canonical: {address: 0x004f27c0, expected: "56 57 6a 00 68"},
          original_2000: {address: 0x004ef8b0, expected: "56 57 6a 00 68"}}}
