# Native replacement hooks installed by opentony.dll (src/hooks/).
#
# Each hook redirects one retail function entry to a native implementation
# through a per-function dispatch stub, so every replacement can be switched
# between native and retail at runtime. Regenerate the checked-in C table after
# any change:
#
#   tony hooks generate        # writes src/hooks/native_hooks_generated.h
#   tony hooks verify          # bytes, boundaries, names, native progress
#
# Rules (enforced by `tony hooks verify`):
# - `name` must be the curated name at `builds.canonical.address` in
#   re/symbols/functions.yml, and have an entry in re/native/functions.yml
#   with status `tested` or later. The native status drives the default:
#   `trace-validated`/`integrated` hooks start enabled, `tested` start disabled.
# - `expected` is the exact retail prologue that `overwrite` bytes replace. It
#   must end on an instruction boundary, contain no relative branch/call, and
#   no branch inside the function may target bytes 1..overwrite-1.
# - `abi` names the calling convention/argument shape the in-process self-test
#   uses to compare retail and native results (see src/hooks/selftest.cpp).
# - Per-build addresses: `canonical` is executables.thps2_pc; other builds come
#   from re/xref/<build>.yml and must have byte-identical prologues.
version: 1

builds:
  canonical:
    description: Activision Value re-release (executables.thps2_pc)
    sha256: f2c7ca7cbc31abd8f748bd4afdc1e30aa1a6700ce91893b618450fd16172669c
    pe_timestamp: 0x3a54c1f6
    size_of_image: 0x025de000
  original_2000:
    description: Original 2000 retail (game/variants/original-2000, PARTYMOD/Cumulative Patch target)
    sha256: 003152194111a3e564c1a458da2a02cc1187a4f47c147a4126f5d37913cfee8a
    pe_timestamp: 0x39ea002f
    size_of_image: 0x025e0000
    address_map: re/xref/original_2000.yml

# Platform services opentony.dll can replace (opt-in, off by default).
#
# lockstep_clock: the game paces itself with a 16 ms timeSetEvent callback
# (SimulationTimeTimerCallback, dwUser = TimerState) that advances
# SimulationPublicTick; every frame limiter waits until the tick has moved
# twice, spinning Game_FrameTick (the Win32 message pump), WINMAIN_Sleep, or
# (two mode loops) nothing at all. With OPENTONY_CLOCK=lockstep the
# asynchronous callback returns immediately and one delivery runs on the game
# thread at each delivery site instead, so a run is a deterministic function
# of its inputs (fixed 30 fps timestep). `lockstep` still paces deliveries to
# wall-clock time; `lockstep-fast` does not (headless verification only).
#
# Delivery sites: `entry` delivers, then runs the function; `pump` is an entry
# site whose first caller defines the game thread (deliveries from any other
# thread, e.g. streaming threads in WINMAIN_Sleep, are ignored); `spin`
# replaces a tick load inside a call-free wait loop with a call to a thunk that
# delivers and then executes the original (non-relative) instruction.
services:
  lockstep_clock:
    timer_callback:
      name: SimulationTimeTimerCallback
      overwrite: 7
      builds:
        canonical: {address: 0x004dace0, expected: "83 ec 08 8b 44 24 14"}
        original_2000: {address: 0x004d7ea0, expected: "83 ec 08 8b 44 24 14"}
    timer_state:
      name: TimerState
      builds:
        canonical: 0x006a05a0
        original_2000: 0x0069d1f0
    delivery_sites:
      - name: Game_FrameTick
        kind: pump
        overwrite: 8
        builds:
          canonical: {address: 0x004f7ce0, expected: "83 ec 1c a1 74 83 9d 02"}
          original_2000: {address: 0x004f4d70, expected: "83 ec 1c a1 c4 4f 9d 02"}
      - name: WINMAIN_Sleep
        kind: entry
        overwrite: 5
        builds:
          canonical: {address: 0x004f6550, expected: "8b 44 24 04 50"}
          original_2000: {address: 0x004f3600, expected: "8b 44 24 04 50"}
      - name: frame limiter spin in the 0x00455f90 mode loop
        kind: spin
        overwrite: 6
        builds:
          canonical: {address: 0x0045600a, expected: "8b 0d 1c e3 56 00"}
          original_2000: {address: 0x00455f7a, expected: "8b 0d 7c af 56 00"}
      - name: frame limiter spin in the 0x0047c5eb mode loop
        kind: spin
        overwrite: 6
        builds:
          canonical: {address: 0x0047c665, expected: "8b 0d 1c e3 56 00"}
          original_2000: {address: 0x00479f55, expected: "8b 0d 7c af 56 00"}

  # Platform HAL (docs/HAL.md). Services are chosen at startup by [hal] in
  # opentony.ini or OPENTONY_HAL; the HAL starts and stops on the game thread
  # at these sites, never inside DllMain. `before` runs the callback, then the
  # function; `after` calls the function, then the callback (argument-less
  # cdecl functions only).
  hal:
    # The game's C runtime _onexit: the HAL registers its shutdown there at
    # startup, so SDL stops on the game thread however the game exits (its
    # D3D_Shutdown calls exit() when a Release leaves references behind).
    onexit:
      name: _onexit
      builds: {canonical: 0x005001e2, original_2000: 0x004fd212}
    entry_sites:
      - name: Game_Startup
        role: startup
        kind: before
        overwrite: 5
        builds:
          canonical: {address: 0x004f7e30, expected: "55 8b ec 6a ff"}
          original_2000: {address: 0x004f4ec0, expected: "55 8b ec 6a ff"}
      - name: WINMAIN_ShutDown
        role: shutdown
        kind: after
        overwrite: 5
        builds:
          canonical: {address: 0x004f86f0, expected: "68 64 c4 55 00"}
          original_2000: {address: 0x004f5750, expected: "68 d0 90 55 00"}
      # The game window exists (MainWindow) and DirectDraw has not seen it
      # yet: the window service adopts it here.
      - name: WINMAIN_InitDirectDraw
        role: window
        kind: before
        overwrite: 6
        builds:
          canonical: {address: 0x004f8130, expected: "81 ec 50 0d 00 00"}
          original_2000: {address: 0x004f5190, expected: "81 ec 50 0d 00 00"}
      # The Direct3D device exists (D3D_ClearBuffers runs right after
      # WINMAIN_InitDirect3D and on every renderer restart): video tracing
      # (OPENTONY_VIDEO_TRACE) attaches here.
      - name: D3D_ClearBuffers
        role: video
        kind: before
        overwrite: 5
        builds:
          canonical: {address: 0x004d0ec0, expected: "a1 a8 a3 9d 02"}
          original_2000: {address: 0x004ce0d0, expected: "a1 f8 6f 9d 02"}
      # Each ordering table the renderer is about to draw: the video shadow
      # (OPENTONY_VIDEO_SHADOW) walks it before retail changes it in place.
      - name: D3D_DrawPolygonList
        role: draw_list
        kind: before_arg
        overwrite: 6
        builds:
          canonical: {address: 0x004d3160, expected: "55 8b ec 83 ec 08"}
          original_2000: {address: 0x004d0370, expected: "55 8b ec 83 ec 08"}
      # A texture record (first argument) is about to get new pixels in its
      # existing surface, or to lose the surface: the video mirror forgets
      # what it copied from it.
      - name: D3DTex_UploadTexture
        role: texture
        kind: before_arg
        overwrite: 6
        builds:
          canonical: {address: 0x004d8f10, expected: "81 ec 90 01 00 00"}
          original_2000: {address: 0x004d6100, expected: "81 ec 90 01 00 00"}
      - name: D3DTex_DestroyRecord
        role: texture
        kind: before_arg
        overwrite: 5
        builds:
          canonical: {address: 0x004d8b50, expected: "56 8b 74 24 08"}
          original_2000: {address: 0x004d5d40, expected: "56 8b 74 24 08"}
    # Retail hook points (re/config/hal_boundary.yml) that the adapters in
    # src/hooks/hal/ replace when their service selects SDL. The entry becomes
    # `jmp adapter` and the retail body never runs, so `expected` only has to
    # identify the function (it may end inside an instruction). A service is
    # all or nothing: one mismatch leaves every hook point of it retail.
    # Adapters register with OT_REGISTER_HAL_ADAPTER(name, function).
    replacements:
      - {name: D3DTimer_Init, service: clock, overwrite: 5, builds: {
          canonical: {address: 0x004dabb0, expected: "33 c9 83 ec 08"},
          original_2000: {address: 0x004d7d70, expected: "33 c9 83 ec 08"}}}
      - {name: D3DTimer_Shutdown, service: clock, overwrite: 5, builds: {
          canonical: {address: 0x004dab80, expected: "e8 ab ff ff ff"},
          original_2000: {address: 0x004d7d40, expected: "e8 ab ff ff ff"}}}
      - {name: WINMAIN_Sleep, service: clock, overwrite: 5, builds: {
          canonical: {address: 0x004f6550, expected: "8b 44 24 04 50"},
          original_2000: {address: 0x004f3600, expected: "8b 44 24 04 50"}}}
      - {name: PCInput_Initialize, service: input, overwrite: 5, builds: {
          canonical: {address: 0x004e4690, expected: "56 57 6a 00 e8"},
          original_2000: {address: 0x004e1860, expected: "56 57 6a 00 e8"}}}
      - {name: PCInput_Poll, service: input, overwrite: 5, builds: {
          canonical: {address: 0x004e4a90, expected: "b9 e0 43 6a 00"},
          original_2000: {address: 0x004e1c60, expected: "b9 30 10 6a 00"}}}
      - {name: PCInput_Shutdown, service: input, overwrite: 5, builds: {
          canonical: {address: 0x004e4a60, expected: "b9 e0 43 6a 00"},
          original_2000: {address: 0x004e1c30, expected: "b9 30 10 6a 00"}}}
      - {name: PCInput_ActuatorOn, service: input, overwrite: 5, builds: {
          canonical: {address: 0x004e4c40, expected: "83 ec 08 53 8b"},
          original_2000: {address: 0x004e1e10, expected: "83 ec 08 53 8b"}}}
      - {name: PCInput_ActuatorOff, service: input, overwrite: 5, builds: {
          canonical: {address: 0x004e4cf0, expected: "a0 5d 69 6a 00"},
          original_2000: {address: 0x004e1ec0, expected: "a0 ad 35 6a 00"}}}
      - {name: PCInput_SetCursorPos, service: input, overwrite: 5, builds: {
          canonical: {address: 0x004e4c10, expected: "8b 44 24 08 8b"},
          original_2000: {address: 0x004e1de0, expected: "8b 44 24 08 8b"}}}
      # video=sdl (src/hooks/hal/video_hal.cpp). WINMAIN_InitDirectDraw and
      # D3D_DrawPolygonList are also entry sites; with video=sdl those sites
      # are not patched and the adapters do their work.
      - {name: WINMAIN_InitDirectDraw, service: video, overwrite: 5, builds: {
          canonical: {address: 0x004f8130, expected: "81 ec 50 0d 00"},
          original_2000: {address: 0x004f5190, expected: "81 ec 50 0d 00"}}}
      - {name: WINMAIN_InitDirect3D, service: video, overwrite: 5, builds: {
          canonical: {address: 0x004f7110, expected: "a1 a8 a3 9d 02"},
          original_2000: {address: 0x004f41c0, expected: "a1 f8 6f 9d 02"}}}
      - {name: D3D_PresentFrame, service: video, overwrite: 5, builds: {
          canonical: {address: 0x004d0c30, expected: "56 e8 9a 34 00"},
          original_2000: {address: 0x004cde40, expected: "56 e8 9a 34 00"}}}
      - {name: D3D_DrawPolygonList, service: video, overwrite: 5, builds: {
          canonical: {address: 0x004d3160, expected: "55 8b ec 83 ec"},
          original_2000: {address: 0x004d0370, expected: "55 8b ec 83 ec"}}}
      - {name: WINMAIN_SwitchResolution, service: video, overwrite: 5, builds: {
          canonical: {address: 0x004f6e60, expected: "81 ec 8c 00 00"},
          original_2000: {address: 0x004f3f10, expected: "81 ec 8c 00 00"}}}
      - {name: WINMAIN_SwitchRenderer, service: video, overwrite: 5, builds: {
