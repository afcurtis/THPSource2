# Platform boundary inventory (Phase 3.0). See docs/HAL.md and
# re/notes/platform-boundary.md.
#
# `roots` are the only hand-written facts the audit consumes: reviewed
# interface-pointer declarations for the places Ghidra's data flow cannot
# follow (heap records reached through untracked pointers, dead library
# methods, and a few call sites whose stack the decompiler mis-tracks). Every
# other COM call site, import call and platform callback is derived from
# Ghidra by `tony hal derive` and checked by `tony hal check`.
#
# Root kinds:
#   {function, value, interface}  object expression inside one function
#   {table, size, interface}      global table of interface pointers
#   {site, interface}             one indirect call whose object is `interface`
#   {site, not_com}               one vtable-shaped call reviewed as a C++ virtual
version: 1

roots:
  canonical:
    # --- D3D texture records (pc\d3dtex.cpp): record+0x0 is the texture surface.
    # D3DTex_UploadTexture writes IDirectDraw7::CreateSurface's out-parameter to
    # record+0x0 (0x004d918f, derived); these functions take the same record.
    - {function: 0x004d8b50, value: "*(arg0)", interface: IDirectDrawSurface7,
       evidence: "D3DTex_DestroyRecord releases *(record) and unlinks the record from the 0x6a051c texture list"}
    - {function: 0x004d9f50, value: "*(arg0)", interface: IDirectDrawSurface7,
       evidence: "PARTYMOD D3DTEX_GrayTexture(record): GetPixelFormat/Lock/Unlock on *(record)"}
    - {function: 0x004da260, value: "*(arg0)", interface: IDirectDrawSurface7,
       evidence: "PARTYMOD D3DTEX_TextureCountColors(record): Lock/Unlock on *(record)"}
    - {function: 0x004d83a0, value: "*(arg0)", interface: IDirectDrawSurface7,
       evidence: "called by D3DSprite_D3DSprite with the record returned by D3DTex_LoadIndexedBitmap; mov eax,[ebp]; call [ecx+0x58] (GetSurfaceDesc) at 0x004d83da"}
    - {site: 0x004d8491, interface: IDirectDrawSurface7,
       evidence: "mov edx,[ebx]; mov eax,[edx]; push eax; call [ecx+0x8]: Release of the record's surface when the system-memory copy flag 0x29da3a0 is set"}
    - {site: 0x004d8883, interface: IDirectDrawSurface7,
       evidence: "Blt into the tile surface at [edx+ebp] of a 0x2c-stride tile array (ebp += 0x2c per tile)"}
    - {site: 0x004d890f, interface: IDirectDrawSurface7,
       evidence: "Release of the staging surface created by CreateSurface at 0x004d8514 ([esp+0x1c])"}
    # --- D3DSprite (pc\d3dsprite.cpp), instruction-level reading of 0x004d7620..0x004d7809.
    - {site: 0x004d7690, interface: IDirectDrawSurface7,
       evidence: "edi = texture record ([esp+0x10]); mov eax,[edi]; call [ecx+0x8]: Release of the record's surface"}
    - {site: 0x004d7718, interface: IDirectDrawSurface7,
       evidence: "Lock(NULL, &ddsd, 0x810, NULL) on the staging surface created at 0x004d7620 ([esp+0x14])"}
    - {site: 0x004d77d6, interface: IDirectDrawSurface7, evidence: "Unlock(NULL) on the same staging surface"}
    - {site: 0x004d7809, interface: IDirectDrawSurface7, evidence: "Release of the same staging surface"}
    - {site: 0x004d7912, interface: IDirectDrawSurface7,
       evidence: "D3DSprite_Destroy: Release of each tile surface [ebx]; SetTexture(0, NULL) when the count reaches 1"}
    # --- DirectPlay wrapper records (pc\dxplay.cpp): {IDirectPlay4A *dp; HRESULT hr; ...}.
    # FUN_004dae70 stores CoCreateInstance(CLSID_DirectPlay, IID_IDirectPlay4A)'s result at record+0x0.
    - {function: 0x004daee0, value: "*(arg0)", interface: IDirectPlay4A, evidence: "Release of record->dp, then record->dp = 0"}
    - {function: 0x004db3f0, value: "*(arg0)", interface: IDirectPlay4A, evidence: "record->dp->EnumConnections (vtable+0x8c)"}
    - {function: 0x004db550, value: "*(arg0)", interface: IDirectPlay4A, evidence: "record->dp->InitializeConnection (vtable+0x98)"}
    - {function: 0x004db310, value: "*(arg0)", interface: IDirectPlay4A,
       evidence: "mov esi,[esp+0xc]; mov eax,[esi]; push eax; call [ecx+0x54]: record->dp->GetPlayerName(id, 0x6a1004, &size)"}
    # --- SDX DirectInput wrapper methods with no references (dead library code).
    # The same fields hold the same interfaces in the live methods of each wrapper.
    - {function: 0x004ec080, value: "*((arg0+0x4))", interface: IDirectInputA,
       evidence: "SDXInput+0x4 is IDirectInputA (DirectInputCreateA out-parameter at 0x004ebfad)"}
    - {function: 0x004ec0c0, value: "*((arg0+0x4))", interface: IDirectInputA, evidence: "as 0x004ec080"}
    - {function: 0x004ecdb0, value: "*((arg1+0x4))", interface: IDirectInputA, evidence: "as 0x004ec080 (SDXInput passed as arg1)"}
    - {function: 0x004ecdb0, value: "*((*((arg0+0x54))+0x4))", interface: IDirectInputA,
       evidence: "SDXJoystick+0x54 holds the SDXInput (FUN_004ecce0 stores param_2 there)"}
    - {function: 0x004ec670, value: "*((arg0+0x108))", interface: IDirectInputDeviceA,
       evidence: "keyboard wrapper+0x108 is the CreateDevice(GUID_SysKeyboard) result (0x004ec522)"}
    - {function: 0x004ecc30, value: "*((arg0+0x28))", interface: IDirectInputDeviceA,
       evidence: "mouse wrapper+0x28 is the CreateDevice result (0x004ec7ac)"}
    - {function: 0x004ed3c0, value: "*((arg0+0x58))", interface: IDirectInputDeviceA,
       evidence: "SDXJoystick+0x58 is the QueryInterface(IID_IDirectInputDevice2A) result (0x004ecd65)"}
    # --- Force-feedback effect wrappers: +0x8 is the CreateEffect result.
    - {function: 0x004ed830, value: "*((arg0+0x8))", interface: IDirectInputEffect,
       evidence: "effect wrapper+0x8 receives IDirectInputDeviceA::CreateEffect's out-parameter (FUN_004ed7d0)"}
    - {function: 0x004ed950, value: "*((arg0+0x8))", interface: IDirectInputEffect, evidence: "as 0x004ed830"}
    - {site: 0x004ecf97, interface: IDirectInputEffect,
       evidence: "SDXJoystick_ReleaseEffectCallback, the EnumCreatedEffectObjects callback registered at 0x004ecf66: mov eax,[esp+4]; push eax; mov ecx,[eax]; call [ecx+0x8] (Release)"}
    # --- Sound voice table (pc\soundlib.cpp): AudioBankRecords, 128 sounds x 10 dwords.
    - {table: 0x029d6920, size: 0x1400, interface: IDirectSoundBuffer,
       evidence: "slots 0..7 of each 0x28-byte AudioBankRecords entry hold the IDirectSound::CreateSoundBuffer buffer (0x004f2c04) and its DuplicateSoundBuffer copies; slot 8 is flags, slot 9 the sound's metadata; the bank table starts at 0x29d7d20"}
    # --- C++ virtual calls in the pc\* region (this in ECX, nothing pushed for it).
    - {site: 0x004cec64, not_com: "thiscall: game object at this+0x38c+4*i (video settings menu)"}
    - {site: 0x004cec7c, not_com: "thiscall: mov ecx,[esi+0x388]; call [eax+0xc]"}
    - {site: 0x004cec9c, not_com: "thiscall: mov ecx,[esi+0x388]; push eax; call [edi+0x14]"}
    - {site: 0x004ceca7, not_com: "thiscall: mov ecx,[esi+0x388]; call [edx+0x10]"}
    - {site: 0x004dbe7d, not_com: "MENUPC_Close: scalar deleting destructor (1) of each cursor sprite in 0x6a1424..0x6a142c"}
    - {site: 0x004dbece, not_com: "MENUPC_DrawMouseCursor: cursor sprite ->Draw(x, y, 0), this in ECX"}
    - {site: 0x004dc9fe, not_com: "PC menu element: this->virtual+0xc(), this in ECX"}
    - {site: 0x004dca6e, not_com: "PC menu element: this->virtual+0xc(), this in ECX"}
    - {site: 0x004dcb39, not_com: "PC menu element: this->child(+0x28)->virtual+0x10(), this in ECX"}
    # --- Game-code calls the argument/push heuristics could not decide
    # (instruction-level reading: ECX holds the object, which is not pushed).
    - {site: 0x00410c73, not_com: "mov eax,[edi]; mov ecx,edi; call [eax+0xc]"}
    - {site: 0x00434097, not_com: "LevelEditor__HandleInput: mov ebp,ecx; mov eax,[ebp]; call [eax] (ECX unchanged)"}
    - {site: 0x0044a3f6, not_com: "Font__draw: mov ecx,[esp+0x1c] (object) before call [edx+0xc]; three pushed arguments"}
    - {site: 0x00471557, not_com: "mov esi,ecx; mov eax,[esi]; call [eax+0x1c]"}
    - {site: 0x00477f46, not_com: "mov ecx,[edx+4*ecx+0xd60]; mov eax,(same); mov edx,[eax]; call [edx+0x24]"}
    - {site: 0x0047930b, not_com: "mov ecx,[eax+0xd54]; mov eax,(same); mov edx,[eax]; call [edx+0xc]"}
    - {site: 0x004ac4d6, not_com: "mov esi,ecx; mov eax,[esi]; call [eax+0x1c]"}
    - {site: 0x004c2f2e, not_com: "mov ecx,[ebp+0x874]; push eax; call [esi+0x14] (esi = vtable)"}
    - {site: 0x004c3224, not_com: "mov edi,[ecx]; ...; mov ecx,[ebp+0x9f8]; push eax; call [edi+0x14]"}
    # --- Calls reached across a branch join, outside the decompiled blocks.
    - {site: 0x0046ba57, not_com: "prologue push ecx/ebx/esi; mov esi,ecx; mov eax,[esi]; call [eax+0x1c] (ECX still this)"}
    - {site: 0x0047015c, not_com: "path 0x47013c: mov ecx,[ebx+0xf8]; jmp; call [edi+0xc] (edi = vtable)"}
    - {site: 0x00470e2d, not_com: "mov ecx,[edi]; mov edx,[ecx]; je 0x470e15 ... push ebx; call [edx+0x4]"}
    - {site: 0x00471235, not_com: "mov ecx,[edi]; mov eax,[ecx]; je 0x47121d ... push ebp; call [eax+0x4]"}
    # --- zlib allocator callbacks (z_stream: zalloc +0x20, zfree +0x24, opaque +0x28), reached by the PKR2 zlib decompressor
    #     that Phase 4.10b disassembled; plain C function pointers (the defaults are the CRT allocators at 0x004fbb20/0x004fbb40).
    - {site: 0x004fb3af, not_com: "zfree(opaque, ptr): call [esi+0x24] with esi = the z_stream (inflateEnd)"}
    - {site: 0x004fb430, not_com: "zalloc(opaque, 1, 0x18): call [esi+0x20] with esi = the z_stream (inflateInit2)"}
    - {site: 0x004fd87f, not_com: "zalloc(opaque, 1, 0x40): call [esi+0x20] with esi = the z_stream (inflate_blocks_new)"}
    - {site: 0x004fd89a, not_com: "zalloc(opaque, 8, 0x5a0): call [esi+0x20] with esi = the z_stream"}
    - {site: 0x004fd8ac, not_com: "zfree(opaque, ptr): call [esi+0x24] after a failed zalloc"}
    - {site: 0x004fd8c3, not_com: "zalloc(opaque, 1, window size): call [esi+0x20] with esi = the z_stream"}
    - {site: 0x004fd8d8, not_com: "zfree(opaque, ptr): call [esi+0x24] after a failed zalloc"}
    - {site: 0x004fd8e3, not_com: "zfree(opaque, ptr): call [esi+0x24] after a failed zalloc"}
    - {site: 0x004fe70e, not_com: "zfree(opaque, ptr): call [esi+0x24] with esi = the z_stream (inflate_blocks_free)"}
    - {site: 0x004fe71c, not_com: "zfree(opaque, ptr): call [esi+0x24] with esi = the z_stream"}
    - {site: 0x004fe727, not_com: "zfree(opaque, ptr): call [esi+0x24] with esi = the z_stream"}

# ---------------------------------------------------------------- hook points
# The game-level functions a HAL service replaces (PARTYMOD-style), and the
# boundary functions each one owns. `tony hal check` proves the ownership:
# every owned function is referenced only from hook points, owned functions or
# groups, and is reachable from its own hook point. Names are curated in
# re/symbols/functions.yml (evidence: re/evidence/functions/platform-boundary.md).
hook_points:
  # --- clock
  - {name: D3DTimer_Init, canonical: 0x004dabb0, service: clock,
     owns: [0x004dad80, 0x004dace0],
     note: "timeGetDevCaps/timeBeginPeriod, then timeSetEvent(16 ms, SimulationTimeTimerCallback); registers D3DTimer_Shutdown with atexit"}
  - {name: D3DTimer_Shutdown, canonical: 0x004dab80, service: clock, note: "timeKillEvent"}
  - {name: WINMAIN_Sleep, canonical: 0x004f6550, service: clock, note: "Sleep(ms); a lockstep clock delivery site"}
  # --- window
  - {name: Game_Startup, canonical: 0x004f7e30, service: window, aliases: ["CP WinMainX"],
     owns: [0x004f7af0],
     note: "WinMain body: RegisterClassA(WINMAIN_WndProc), CreateWindowExA, ShowWindow, cursor; then calls every subsystem init in order"}
  - {name: Game_FrameTick, canonical: 0x004f7ce0, service: window, aliases: ["PARTYMOD WinYield"],
     note: "Win32 message pump every frame limiter spins"}
  # --- input
  - {name: PCInput_Initialize, canonical: 0x004e4690, service: input, aliases: ["PARTYMOD InitDirectInput"],
     owns: [0x004ebf90, 0x004ec000, 0x004ec040, 0x004ec100, 0x004ec160, 0x004ec500, 0x004ec630, 0x004ec790,
            0x004ec860, 0x004ec8c0, 0x004ecce0, 0x004ece80, 0x004ecfb0, 0x004ed100, 0x004ed250, 0x004ed380,
            0x004ed7d0],
     note: "DirectInputCreateA(0x0700); keyboard, mouse and up to two joysticks through the SDX wrapper classes; SetCapture"}
  - {name: PCInput_Poll, canonical: 0x004e4a90, service: input, aliases: ["PARTYMOD ReadDirectInput"],
     owns: [0x004e42c0, 0x004ec5c0, 0x004ec990, 0x004ecbf0, 0x004ed2c0],
     note: "per-frame device reads and PCInput_BuildActionMask (the retail action bank and bitmask)"}
  - {name: PCInput_Shutdown, canonical: 0x004e4a60, service: input, aliases: ["PARTYMOD PCINPUT_ShutDown"],
     owns: [0x004ebfe0, 0x004ec590, 0x004ec830, 0x004ecf50, 0x004ecf90]}
  - {name: PCInput_ActuatorOn, canonical: 0x004e4c40, service: input, aliases: ["PARTYMOD PCINPUT_ActuatorOn"],
     owns: [0x004ed950, 0x004ed830]}
  - {name: PCInput_ActuatorOff, canonical: 0x004e4cf0, service: input, owns: [0x004ed4c0]}
  - {name: PCInput_SetCursorPos, canonical: 0x004e4c10, service: input}
  # --- video
  - {name: WINMAIN_InitDirectDraw, canonical: 0x004f8130, service: video, aliases: ["PARTYMOD initDDraw"],
     owns: [0x004f8630],
     note: "DirectDrawEnumerateExA + registry device choice, DirectDrawCreateEx(IID_IDirectDraw7), cooperative level, display mode, primary + back buffer"}
  - {name: WINMAIN_InitDirect3D, canonical: 0x004f7110, service: video, aliases: ["PARTYMOD initD3D"],
     owns: [0x004f78f0, 0x004f7980],
     note: "QueryInterface(IID_IDirect3D7), EnumDevices, EnumZBufferFormats, z-buffer, CreateDevice, initial render states"}
  - {name: WINMAIN_EnumDisplayModes, canonical: 0x004f7a70, service: video, owns: [0x004f79e0]}
  - {name: WINMAIN_SwitchResolution, canonical: 0x004f6e60, service: video, aliases: ["PARTYMOD WINMAIN_SwitchResolution"]}
  - {name: WINMAIN_SwitchRenderer, canonical: 0x004f6d20, service: video, aliases: ["CP WINMAIN_SwitchRenderer"]}
  - {name: D3D_ClearBuffers, canonical: 0x004d0ec0, service: video, aliases: ["PARTYMOD D3D_ClearBuffers"]}
  - {name: D3DPoly_StartScene, canonical: 0x004d3b40, service: video, aliases: ["PARTYMOD D3DPOLY_StartScene"],
     owns: [0x004d0a60, 0x004d0dd0]}
  - {name: D3D_InitPrimitiveDispatch, canonical: 0x004d41e0, service: video, aliases: ["PARTYMOD D3DPOLY_Init"],
     note: "GetCaps; fills D3DPrimitiveDispatchTable (0x0065f82c) with the D3D_Draw* primitives"}
  - {name: D3D_DrawPolygonList, canonical: 0x004d3160, service: video, aliases: ["PARTYMOD D3DPOLY_DrawOTag"],
     owns: [0x004d3480, 0x004d3510, 0x004d3780, 0x004d3600, 0x004d36c0, 0x004d42f0, 0x004d45f0, 0x004d49e0,
            0x004d4bf0, 0x004d5040, 0x004d5280, 0x004d56c0, 0x004d5960, 0x004d5e40, 0x004d6090, 0x004d60c0,
            0x004d60f0, 0x004d6120, 0x004d6320, 0x004d6560, 0x004d66f0, 0x004d68b0, 0x004d71f0],
     note: "walks the PSX-style ordering table and dispatches each primitive through D3DPrimitiveDispatchTable"}
  - {name: D3D_PresentFrame, canonical: 0x004d0c30, service: video, aliases: ["PARTYMOD D3D_EndSceneAndFlip"]}
  - {name: D3D_Shutdown, canonical: 0x004d0f80, service: video, owns: [0x004d7450],
     note: "releases the device and surfaces; with full=1 (every fatal error path) also textures and Audio_Shutdown"}
  - {name: D3D_SaveScreenshot, canonical: 0x004d0d00, service: video,
     note: "SCR_%05i.bmp from the primary surface (screenshot key in PCInput_Poll and WINMAIN_WndProc)"}
  - {name: D3DTex_Init, canonical: 0x004da840, service: video, aliases: ["PARTYMOD D3DTEX_Init"]}
  - {name: D3DTex_UploadTexture, canonical: 0x004d8f10, service: video, aliases: ["PARTYMOD makeTextureListEntry"],
     owns: [0x004d9310, 0x004d9630, 0x004d8990, 0x004d7e10]}
  - {name: D3DTex_DestroyRecord, canonical: 0x004d8b50, service: video, aliases: ["PARTYMOD freeD3DTexture (call-site patches)"]}
  - {name: D3DTex_LoadIndexedBitmap, canonical: 0x004d9950, service: video, aliases: ["PARTYMOD D3DTEX_AddToTextureList3"]}
  - {name: D3DTex_GrayTexture, canonical: 0x004d9f50, service: video, aliases: ["PARTYMOD D3DTEX_GrayTexture"]}
  - {name: D3DTex_CountUsedPaletteEntries, canonical: 0x004da260, service: video, aliases: ["PARTYMOD D3DTEX_TextureCountColors"]}
  - {name: D3DSprite_Create, canonical: 0x004d74a0, service: video, aliases: ["PARTYMOD D3DSprite_D3DSprite"],
     owns: [0x004d83a0]}
  - {name: D3DSprite_Destroy, canonical: 0x004d78c0, service: video, aliases: ["PARTYMOD D3DSprite_Destroy"]}
  # --- audio
  - {name: Audio_Init, canonical: 0x004f27c0, service: audio,
     note: "DirectSoundCreate(AudioDevice), SetCooperativeLevel(DSSCL_EXCLUSIVE), GetCaps"}
  - {name: Audio_Shutdown, canonical: 0x004f28a0, service: audio}
  - {name: Audio_LoadSoundBank, canonical: 0x004f2960, service: audio, owns: [0x004f2b40, 0x004f2c70, 0x004ed9b0]}
  - {name: Audio_FreeSoundBank, canonical: 0x004f2ad0, service: audio, owns: [0x004f2da0]}
  - {name: Audio_PlaySound, canonical: 0x004f2e20, service: audio}
  - {name: Audio_StopSound, canonical: 0x004f37c0, service: audio}
  - {name: Audio_SetVoiceVolume, canonical: 0x004f34b0, service: audio, owns: [0x004f3200]}
  - {name: Audio_SetVoiceFrequency, canonical: 0x004f3690, service: audio}
  - {name: Audio_GetVoiceFrequency, canonical: 0x004f3720, service: audio}
  - {name: Audio_PauseLooping, canonical: 0x004f3900, service: audio, owns: [0x004f3870]}
  - {name: Audio_ResumeLooping, canonical: 0x004f3940, service: audio}
  # --- movie (Bink video and streamed music)
  - {name: PCMovie_PlayStartupMedia, canonical: 0x004e5ec0, service: movie, aliases: ["CP PCMOVIE_PlayMovieFile"],
     owns: [0x004e5720, 0x004e5a80, 0x004e6020, 0x004e6590, 0x004e5e90, 0x004e6890, 0x004e6da0],
     note: "full-screen movie loop: Bink decode into a DirectDraw surface, Direct3D quad, own message pump"}
  - {name: PCMOVIE_StartFMV, canonical: 0x004e70e0, service: movie}
  - {name: PCMOVIE_Update, canonical: 0x004e71c0, service: movie, owns: [0x004e6e50]}
  - {name: PCMOVIE_StopFMV, canonical: 0x004e7140, service: movie}
  - {name: PCMOVIE_StartMusic, canonical: 0x004e7260, service: movie, owns: [0x004e71d0],
     note: "music (Music/ltix*.dat) is Bink audio, not CD audio; streamed by PCMOVIE_StreamThread (_beginthread)"}
  - {name: PCMOVIE_XAStop, canonical: 0x004e7370, service: movie}
  - {name: PCMOVIE_SetXAVolume, canonical: 0x004e72d0, service: movie}
  - {name: PCMOVIE_Pause, canonical: 0x004e6e70, service: movie}
  # --- fs
  - {name: PCinit, canonical: 0x004e73f0, service: fs, owns: [0x004f6730],
     note: "file-system init: CD_DriveScan (GetDriveTypeA) chooses the CD and install paths"}
  - {name: CD_CheckAudioTOC, canonical: 0x004bb240, service: fs, owns: [0x004bb0b0, 0x004bb2d0, 0x004baeb0, 0x004baf50],
     note: "CD check: compares texture.dat (read next to the exe) with the disc's audio TOC via MCI (open/status/close, no playback)"}
  - {name: CD_Recheck, canonical: 0x004f6510, service: fs}
  - {name: WINMAIN_FindFiles, canonical: 0x004f6560, service: fs}
  - {name: WINMAIN_LoadSetting, canonical: 0x004f6ca0, service: fs, note: "GetPrivateProfileStringA"}
  - {name: WINMAIN_SaveSetting, canonical: 0x004f6cd0, service: fs, note: "WritePrivateProfileStringA"}
  # --- debug (not a HAL service)
  - {name: printf_log, canonical: 0x004cf850, service: debug, note: "OutputDebugStringA"}

# Boundary functions that are deliberately not hooked.
groups:
  - status: dead
    service: input
    note: "SDX DirectInput wrapper methods with no references at all (unused library code)"
    functions: [0x004ec080, 0x004ec0c0, 0x004ec670, 0x004ecc30, 0x004ecdb0, 0x004ed3c0]
  - status: runtime
    service: input
    note: "static SDX wrapper destructors run by the C runtime at exit; they release only non-NULL interfaces"
    functions: [0x004ebf70, 0x004ec4e0, 0x004ec740, 0x004eccc0]
  - status: out_of_scope
    service: net
    note: "multiplayer: pc\\dxplay.cpp, pc\\netgame.cpp and the Win32 setup dialogs stay retail (decision in docs/phases/PHASE_3_SUMMARY.md, \"Kickoff decisions\")"
    functions: [0x004dae70, 0x004daee0, 0x004daf10, 0x004db080, 0x004db1a0, 0x004db1c0, 0x004db200, 0x004db2d0,
                0x004db310, 0x004db350, 0x004db3f0, 0x004db550, 0x004db5a0, 0x004db690, 0x004db9a0, 0x004dba40,
                0x004dbb40, 0x004dbcc0, 0x004dd980, 0x004ddd60, 0x004e0120, 0x004e1490, 0x004e14e0, 0x004e1650,
                0x004e1850, 0x004e18f0, 0x004e1910, 0x004e1970, 0x004e1a60, 0x004e1a80, 0x004e2040,
                0x004e1720, 0x004e1aa0]  # the last two: dialog procedures passed to DialogBoxParamA

# Boundary functions that do not exist in the original 2000 build: the
# canonical Activision Value release checks the disc's audio track table against
# texture.dat (the original had SafeDisc 2 and has no texture.dat string).
variant_absent:
  - functions: [0x004bb240, 0x004bb0b0, 0x004bb2d0, 0x004baeb0, 0x004baf50, 0x004f6510]
  - sites: [0x004f7b61, 0x004f7eec]
    note: "MessageBoxA 'Please insert the Tony Hawk's Pro Skater 2 CD-ROM, select OK, and restart the game.'"

# Calls the call graph cannot see: the ordering-table walkers call whatever
# D3D_InitPrimitiveDispatch stored in D3DPrimitiveDispatchTable.
