completion:
- 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the groups mem): the probe makes a legal state in the game''s own globals and a scratch slab, calls the retail function, and records the return value, every written byte and the ordered service calls; the native replay (heap_retail_calls_test.cpp) starts from the same bytes and compares all three, and a changed fixture value makes it fail. 18 of the 19 functions (the game''s heap: two zones cut into blocks with packed headers, the free lists and their merge, the front, top and placement allocations, free and shrink, the block-size and free-bytes queries, the memory copies and swap, the empty debug hooks and the four wrappers other code calls (the loaded-buffer allocation, delete, shrink and block size)) are replayed over 7000 cases with no mismatch (at least 300 cases each; the committed fixtures keep the first 30 of each capture per function, 540 cases, which replay with no mismatch too).'
- 'Documented exclusion, not a blocker - `Bang` (0x0046ee20), the out-of-memory stop, prints through a PSX stub and spins for ever, so no forced call can return from it: the port reports the print and returns, and the test checks that print; the two calls to it in the allocators are the only lines of `heap.cpp` the replay does not reach. Not replayed: 0x0046ee20.'
