completion:
  - Each hooked function has a wrap/shift/aliasing-exact portable implementation with native unit tests.
  - The in-process differential self-test covers every hooked ABI shape (thiscall Vec3/Vec3s operand, scalar, divisor, byte-count and compare forms; fastcall self-only Vec3s; value-returning cdecl Vec3s) and passes for both supported executables, including the negative controls.
  - Retail scenario replays match with the harness loaded, with every hook native, with every hook routed back to retail, and while the master switch flips at runtime; a fault variant diverges.
  - Hooks that ran natively in those replays are trace-validated and default native; the six that recorded no native calls stay tested and default retail.
  - The remaining value-returning Vec3s operators and the int32 out-of-place operators are an explicit seam (hook-harness.md, Decisions); the GDB retail replay stall moved to the simulation-time-callback slice.
