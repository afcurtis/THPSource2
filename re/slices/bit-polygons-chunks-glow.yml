completion:
- 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the groups bit2, bit3): the probe makes a legal state in the game''s own globals and a scratch slab, calls the retail function, and records the return value, every written byte and the ordered service calls; the native replay (bit_retail_calls_test.cpp) starts from the same bytes and compares all three, and a changed fixture value makes it fail. 33 of the 33 functions (the general polygon (three or four corners), the chunk bit (a triangle that flies off along its normal: constructor, colours, texture words and world coordinates through the GTE), the glow (sections and fringes in one block: constructors, setters, destructor), the wobbly glow, and the flat, linked and pixel bits) are replayed over 6600 cases with no mismatch (at least 200 cases each; the committed fixtures keep the first 30 of each capture per function, 990 cases, which replay with no mismatch too).'
- Documented exclusion, not a blocker - the allocator, the block-size query and the random numbers are services; the glow with no points divides by zero in retail and is skipped.
