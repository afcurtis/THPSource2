completion:
  - 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the gvwn, glvp, gprl and gled groups: windows built by hand with fake children, the font and the spooler''s calls seams): the retail function is called on a random legal state; the return value, every written byte and the ordered service calls are compared with the native replay (`goals_retail_calls_test.cpp`), and a changed fixture value makes the replay fail. 21 of the 21 functions are replayed over 1260 cases with no mismatch, assertion paths included.'
  - Documented exclusion, not a blocker - the engine's sprite, sound, card, model and prompt calls and the screen loop's window methods are seams reported by name with the arguments retail passed; the loop's frame waits for the clock with a spin a forced call cannot satisfy, so it is replayed on frames that end at once (the unit tests cover the rest).
