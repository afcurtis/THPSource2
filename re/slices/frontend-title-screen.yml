completion:
  - 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the mainmenu group): the retail function is called on a random legal state built in a scratch slab, its virtual methods and every service outside the file stubbed (fake vtables whose slots are retail functions nothing here reaches, one per method, so each call is a named service carrying the object; some cases use the real vtables so the native dispatch runs the toolkit''s own methods); the return value, every written byte and the ordered service calls are compared with the native replay (`menu_retail_calls_test.cpp`), and a changed fixture value makes the replay fail. The title screen''s window, its wheel and the memory-card scan window: 21 of the 21 functions are replayed over 840 cases with no mismatch, assertion paths included.'
  - Documented exclusion, not a blocker - the loops that run the screens (MainMenu_Main, CardScreen_Main and their wrappers) are the slice `frontend-screen-loops`; the engine's text effect object, the text box and the sprite classes are seams reported by name; the real classes' per-frame hook (an engine function) is reported by fake vtables, the same slot the window base reports as `element_hook`.
