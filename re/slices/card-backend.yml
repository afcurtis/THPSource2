- 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the groups mmu): the probe makes a legal state in the game''s own globals and a scratch slab, calls the retail function, and records the return value, every written byte and the ordered service calls; the native replay (mmu_retail_calls_test.cpp) starts from the same bytes and compares all three, and a changed fixture value makes it fail. 10 of the 10 functions (the PC build''s libcard emulation: the directory scan into 0x94-byte records, create, remove, open and close, the 128-byte-aligned reads and writes at an offset, the open-transfer-close pairs and the empty readiness call) are replayed over 1474 cases with no mismatch (at least 134 cases each; the committed fixtures keep the first 30 of each capture per function, 300 cases, which replay with no mismatch too).'
