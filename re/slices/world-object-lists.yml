completion:
  - "The intrusive object lists are reproduced link for link, including the retail habit of leaving a removed object's own next pointer untouched, so the suspend-by-node and unsuspend-by-node loops carry on into the list the object just joined."
  - "Ob_AI is a native per-frame loop: nearest-player distance, far-away suspension, the update hooks, and the two-frame death then delete sequence; the distance formula matches the retail value stored at +0xb8 in 948 replayed updates."
  - "TRG_CreateObject for the 0xcb family is modelled by ScriptWorld: objects are created suspended unless the node option list carries option 2, and activate/suspend/signal/kill messages act on the real lists."
  - "Documented exclusion, not a blocker - SendVisible, enviro-item, rail and light kills are hooks only and belong to the planned slice world-enviro-messaging; the platform kill path and the game-object loop moved to the completed slice platform-script-object."
  - "Documented exclusion, not a blocker - retail traces do not exercise suspension, activation or kill messages on baddy objects (idle Warehouse); these are covered by unit tests built from the disassembly."
