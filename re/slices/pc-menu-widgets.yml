completion:
- 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the groups mouse of net_specs.py): the probe makes a legal state in the game''s own globals and a scratch slab, calls the retail function, and records the return value, every written byte and the ordered service calls; the native replay (`net_retail_calls_test.cpp`) starts from the same bytes and compares all three, and a changed fixture value makes it fail. 16 of the 16 functions (the pointer-driven menu widgets: the key-name table lookups, the text entry control, the saved-park list, the slider and menu-row mouse pick, the sprite colour and tint, the lobby banner style and the empty hooks) are replayed over 3200 cases with no mismatch (at least 200 cases each; the committed fixtures keep the first 30 of each capture per function, 480 cases, which replay with no mismatch too).'
- Documented exclusion, not a blocker - the font calls, the menu row's constructor and destructor, the file search, the allocator, the rectangle test (0x004dbf90) and the pending-button store are services; the CRT's stricmp, strchr and _ftol are the native equivalents.
