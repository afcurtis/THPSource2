completion:
  - "Retail platform updates and CPlatform__Bounce calls replay from their raw entry images and match on every modelled field, the command sequence, variable reads, Rnd draws, collision queries and side-effect calls (Warehouse and Hangar traces; the counts are in the evidence page)."
  - "All 351 platform scripts of the 32 shipped levels run for 600 frames with bounces forced and no assertion or fault."
  - "The game-object frame loop (Ob_QuickAI), the input-flag clear and the proximity wake-up (Ob_MaybeUnSuspendOrCull) are native and drive platforms from LevelRuntime; the level test creates, wakes, throws and settles real Warehouse props."
  - "Documented exclusion, not a blocker - Shatter_Item debris, sounds, grunt surface sounds and vibration are services, not native effects."
  - "Documented exclusion, not a blocker - bounce kinds 2 and 4 never occurred in a retail trace (the traced kinds are 1, 3 and 5); their launch code is unit tested from the disassembly."
  - "Documented exclusion, not a blocker - physics types 1 and 2, move-to steering, scale animation, halt, shatter and hit are covered by unit tests built from the disassembly and by the corpus run; no retail trace reaches them (Warehouse and Hangar props are bouncy)."
  - "Documented exclusion, not a blocker - thrown props probe the level with the conservative PsxCollisionWorld segment test in the level runtime; the exact retail query is the moving-prop-collision slice."
  - "Documented exclusion, not a blocker - the retail SimulationTime unit is not derived; the level runtime stands in the level clock in milliseconds."
