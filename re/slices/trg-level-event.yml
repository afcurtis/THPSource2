completion:
  - Opcode 0x009e is proven operand-free in normal and conditional-skip paths, including stream-boundary failures.
  - Mode-8/mode-9 raw counter writes and first-call latch initialization are represented with explicit caller inputs.
  - Eligible per-frame countdown, animation selection, camera-step deltas, replay reset, completion, and pending-score handoffs have deterministic tests.
  - FUN_0044e0f0 (end-of-run ranking and menu transition) and FUN_004dee50 (load synchronisation and diagnostics) belong to the front-end/results and streaming work; the trigger service does not consume their results.
  - The three helper functions are characterised in level-event-runtime.md (0x004ab9c0 is a two-write leaf; 0x004dee50 is a load-sync and logging wait; 0x0044e0f0 is the end-of-run handler) and none returns a value into the trigger stream.
  - LevelEventGameplayOwner applies animation, replay-slot, score, and camera writes with raw player-field names preserved where semantics remain open.
