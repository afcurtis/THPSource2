completion:
- 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the groups rpal, rpc): the probe makes a legal state in the game''s own globals and a scratch slab, calls the retail function, and records the return value, every written byte and the ordered service calls; the native replay (render_retail_calls_test.cpp) starts from the same bytes and compares all three, and a changed fixture value makes it fail. 23 of the 23 functions (the palette slots of the PSX video memory (initialisation, the source lookup, the free slots, the creation of a palette from PSX colours, its copy to and from memory) and the palette cache of the D3D texture layer (the records, the conversion of 15-bit colours to the device format, the re-upload of the textures that use a palette)) are replayed over 920 cases with no mismatch (at least 40 cases each; the committed fixtures keep the first 30 of each capture per function, 690 cases, which replay with no mismatch too).'
- Documented exclusion, not a blocker - the VRAM allocator, the PSX clear and load of an image, the texture re-upload and the CRT allocator are services.
