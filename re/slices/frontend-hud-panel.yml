completion:
  - 'Retail forced calls in the running game (Warehouse, level loaded, `re/gdb/probes/frontend_calls.py` with the panel group): the retail function is called on a random legal state poked into the live player-one skater and the HUD globals, its virtual methods and every service outside panel.cpp stubbed; the return value, every written byte and the ordered service calls are compared with the native replay (`hud_retail_calls_test.cpp`), and a changed fixture value makes the replay fail. The in-game HUD (panel.cpp): the polygon builders, the score, special meter, timer, trick points and trick names, the icons, the tape letters, the level and replay messages, the viewport layouts (`Panel_Display`) and the panel constructor, loader and unloader: 29 of the 29 functions are replayed over 1562 cases with no mismatch, assertion paths included; the draw functions are also replayed on the untouched live state at two frames of the Warehouse run.'
  - Documented exclusion, not a blocker - sprites, fonts and text effects are drawn through fake vtables in the probe (a draw is a reported call carrying the object), so what each draw looks like is the text layer's and the engine's validation; the viewport index of a layout nothing in a shipped level reaches (above 7) reads stack garbage in retail and is not generated.
