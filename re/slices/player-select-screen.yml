completion:
  - 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the sel, bio, view, load and selloop groups): the retail function is called on a random legal state built in a scratch slab (windows built by hand with fake pool objects whose virtual methods are reported services, real sprite, text and menu rows where a width or a text is computed, constructors run for real in the arena); the return value, every written byte and the ordered service calls are compared with the native replay (`player_select_retail_calls_test.cpp`), and a changed fixture value makes the replay fail. 72 of the 72 functions are replayed over 2837 cases with no mismatch, assertion paths included.'
  - Documented exclusion, not a blocker - the constructors of the screen's big classes (as the select window's initialiser calls them), the spool's per-character functions (player_spool.cpp), the engine's model, render, palette, memory-card and fade calls and the screen loop's window methods are seams reported by name with the arguments retail passed (the methods are replayed on their own).
