completion:
- 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the groups d3dm of platform_specs*.py): the probe makes a legal state in the game''s own globals and a scratch slab, calls the retail function, and records the return value, every written byte and the ordered service calls; the native replay (`platform_retail_calls_test.cpp`) starts from the same bytes and compares all three, and a changed fixture value makes it fail. 16 of the 16 functions (the game-logic helpers of pc\d3d*.cpp: the pixel mask bit counters, the viewport rectangle, the begin-scene frame limiter and the scene end, the reversed ordering-table list and the free list, the gamma tables, the polygon extent test, the solid rectangles, the polygon heap and the software frame copy) are replayed over 2400 cases with no mismatch (at least 150 cases each; the committed fixtures keep the first 30 of each capture per function, 480 cases, which replay with no mismatch too).'
- Documented exclusion, not a blocker - Direct3D, the software renderer's scene end, _controlfp, operator new / delete and the clock's sleep are services; the gamma power is the x87 intrinsic reproduced with long double.
