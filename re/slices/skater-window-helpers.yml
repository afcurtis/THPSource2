completion:
  - 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the skhelp group): the retail function is called on a random legal state built in a scratch slab, its virtual methods and every service outside the file stubbed (fake vtables whose slots are retail functions nothing here reaches, one per method, so each call is a named service carrying the object); the return value, every written byte and the ordered service calls are compared with the native replay (`skater_windows_retail_calls_test.cpp`), and a changed fixture value makes the replay fail. The helpers of commonfe.cpp: the plain functions (light rig, colour indices, RGBs chunk walk, busiest material, face bitmap, replay level flag), the ColourText, StepperRow and NumberRow menu items, the ModelView screen element and the InitialsWindow: 38 of the 38 functions are replayed over 1520 cases with no mismatch, assertion paths included.'
  - Documented exclusion, not a blocker - the engine's model, spooler and sprite calls (PSX region queue, object records, view and object rendering) are seams reported by name with the arguments retail passed; a string shortened to fit (`CommonFe_LoadFaceBitmap`) is only generated with names of three characters or more (a two-character name leaves the byte after the 'g' to the stack).
