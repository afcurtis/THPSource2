completion:
  - A deterministic native GameplayFrame fixture covers one ordinary grounded and one air-to-landing frame across input history, action history, movement, collision, commit, state transition, and animation request.
  - The selected producer/consumer order and fixed-point values are recorded in the compact integration fixture.
  - The frame-head +0x2dac producer (0x0049e6b8..0x0049e804) drives native replay from the skater stat, entry state and recorded state-2 draw instead of the recorded pre-frame word; a stat mutation diverges, the real stat matches 256/256. The one remaining post-frame hook input, the +0x2c10 divisor written by TrickScript_Execute, moved to the planned trick-script-physics-writes slice.
  - The 0x0049b010 contract is owned by the complete ground-motion-ordinary slice; its Autokick-off decay path 0x0049d630 is a separate, still unnamed function recorded as an open question in ground-movement.md.
  - The grounded turn rounding is closed by the complete ground-turn-lean slice's analog-lean fixtures, and all five Warehouse strict native replays match 256/256.
  - 0x00493370 runs every frame and its non-grounded branch covers every state but 0/7. The +0x40/+0x60 records and the DAT_0056b7f0 gate, the 0x64000 fast step, the +0x3060 re-press window and the +0x2e80 spin gate are modelled and confirmed by a live retail trace (four native fixtures); +0x2e84 is modelled at its 0x00497f40 consumer. The spin-count producer moved to the planned air-spin-controls slice.
  - The long-standing physics_frame_test ordering failure was a fixture outside the retail 0x74 support window; both sides of that window are now tested and ctest is 81/81.
