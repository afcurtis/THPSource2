completion:
- 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the groups d3dm of platform_specs*.py): the probe makes a legal state in the game''s own globals and a scratch slab, calls the retail function, and records the return value, every written byte and the ordered service calls; the native replay (`platform_retail_calls_test.cpp`) starts from the same bytes and compares all three, and a changed fixture value makes it fail. 9 of the 9 functions (the texture record glue of pc\d3dtex.cpp: destroying all records, loading a bitmap into a record, preparing a texture from a file''s header, creating a record for supplied pixels, attaching a record to a scene material and releasing it) are replayed over 1350 cases with no mismatch (at least 150 cases each; the committed fixtures keep the first 30 of each capture per function, 270 cases, which replay with no mismatch too).'
- Documented exclusion, not a blocker - the record allocator, the image opener, the file reads, the upload and the record destroyer are services (the 4.5 / 4.6 natives keep their own state model).
