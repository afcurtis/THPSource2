completion:
- 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the groups pkr): the probe makes a legal state in the game''s own globals and a scratch slab, calls the retail function, and records the return value, every written byte and the ordered service calls; the native replay (core_retail_calls_test.cpp) starts from the same bytes and compares all three, and a changed fixture value makes it fail. 15 of the 15 functions (the PKR2 package wrappers: the run-length compression and decompression with one- and two-byte counts, the zlib wrappers, the compression dispatch by an entry''s method, the package header load and unload, and the stream object) are replayed over 4500 cases with no mismatch (at least 300 cases each; the committed fixtures keep the first 30 of each capture per function, 450 cases, which replay with no mismatch too).'
- Documented exclusion, not a blocker - a run longer than 65,535 bytes (the two-byte count overflow of `PKR2_CompressWIBD`) would need a 64 KB source per case and is derived from the disassembly; with no buffer at all the stubbed zlib would write through a null pointer, so the probe never fails the first allocation of `PKR2_CompressZlib`.
