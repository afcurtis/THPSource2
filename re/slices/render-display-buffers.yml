completion:
- 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the groups rdb): the probe makes a legal state in the game''s own globals and a scratch slab, calls the retail function, and records the return value, every written byte and the ordered service calls; the native replay (render_retail_calls_test.cpp) starts from the same bytes and compares all three, and a changed fixture value makes it fail. 13 of the 13 functions (the display buffers of the renderer (the Db_ functions): the ordering-table size, the sky colour, the vertical-blank callback and its hand-off of buffers to the GPU, the wait for the drawn buffer, the end of a frame, the installation of the callback, the initialisation and reset of the tables and the primitive area, the hi-res set-up, the buffer flips and the immediate display the loading screens use) are replayed over 552 cases with no mismatch (at least 40 cases each; the committed fixtures keep the first 30 of each capture per function, 422 cases, which replay with no mismatch too).'
- Documented exclusion, not a blocker - the PSX library calls (the display and draw environments, the GPU start, the draw sync, the video-memory clear), the allocator and the game clock are services; the timer callback is held still so that the clock does not tick during a case.
