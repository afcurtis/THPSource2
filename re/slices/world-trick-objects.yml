- Documented exclusion, not a blocker - the model items, the sound, the net game, the replay recorder and the trigger pulse are services; the delete-all pair has a group of its own (the objects' deleting destructor is a stub there, with the list's new head scripted). `0x004be140` (an unlisted wireframe renderer) is not ported.
