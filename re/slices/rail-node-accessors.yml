completion:
- 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the groups rln): the probe makes a legal state in the game''s own globals and a scratch slab, calls the retail function, and records the return value, every written byte and the ordered service calls; the native replay (rail_retail_calls_test.cpp) starts from the same bytes and compares all three, and a changed fixture value makes it fail. 14 of the 14 functions (the accessors of the rail nodes of the level''s node table: the trigger word and its address, the rail kind, the rail-node test (type 10/11 and the player-count mask), the links of a node, the next and previous node of a rail (the walk that skips nodes marked done), the state of the record that holds a node, and the lookup table that numbers the rail nodes) are replayed over 4200 cases with no mismatch (at least 300 cases each; the committed fixtures keep the first 30 of each capture per function, 420 cases, which replay with no mismatch too).'
- Documented exclusion, not a blocker - the node decoder (`TRG_DecodeNodePosition`) and the link table reader (`TRG_GetNodeLinks`) belong to the trigger-file sub-milestone and are services here (the probe scripts the position, the address after it and the link table address); a walk through a graph with a cycle that does not include its start never ends in retail, so the probe builds only forward links and rings that include the start.
