completion:
- 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the groups utl): the probe makes a legal state in the game''s own globals and a scratch slab, calls the retail function, and records the return value, every written byte and the ordered service calls; the native replay (core_retail_calls_test.cpp) starts from the same bytes and compares all three, and a changed fixture value makes it fail. 27 of the 27 functions (the rest of utils.cpp: the random seed, the y rotations, the unit vector, the direction from angles, the distances, the cosine between three points, the look angles, the turn towards a target, the case-insensitive name comparison, the platform AI window test, the arccosine to an angle, the line of sight and ground height queries, the object-list sweeps (kill in a box, visibility of the five lists), the spatial sound attenuation, the pulse and the range limit) are replayed over 8100 cases with no mismatch (at least 300 cases each; the committed fixtures keep the first 30 of each capture per function, 810 cases, which replay with no mismatch too).'
- Documented exclusion, not a blocker - the square root (0x004f53b0), the collision queries and the object methods are services; a zero distance or a period of 1 faults in retail (the probe never asks); the arccosine of a ratio beyond +-1 goes to the C runtime's error path (not asked); `Utils_TurnTowards` was already native in the object-script port and is replayed here too.
