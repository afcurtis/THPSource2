- 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the groups mathk of math_specs.py): the probe makes a legal state in the game''s own globals and a scratch slab, calls the retail function, and records the return value, every written byte and the ordered service calls; the native replay (`math_retail_calls_test.cpp`) starts from the same bytes and compares all three, and a changed fixture value makes it fail. 9 of the 9 functions (the Q12 matrix builders: the rotations about X, Y and Z of a matrix in place (a column at a time through gte_rtir, so they leave RT, IR and MAC behind), the three-angle constructors (Y X Z, Z Y X and a second copy of the first), the matrix multiply and the Rz Rx Ry chain, the transpose and the translation store) are replayed over 5400 cases with no mismatch (at least 600 cases each; the committed fixtures keep the first 30 of each capture per function, 540 cases, which replay with no mismatch too).'
- Documented exclusion, not a blocker - `Math_RotationMatrixFromAngles` (0x004e80e0) was ported with the platform script objects and keeps that mapping; it is replayed here too. The 14 bytes the multiply copies from the stack past its 18-byte result are not compared (the replay marks them unspecified).
