completion:
  - 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the bmp and bmpv groups: pictures of random size, colour count and palette poked into a scratch slab, the allocator, the file opener and reader, the VRAM transfer calls and GetFree256Slot reported by address (the palette upload as a text: the rectangle then its 512 bytes)): the retail function is called on a random legal state; the return value, every written byte and the ordered service calls are compared with the native replay (`front_retail_calls_test.cpp`), and a changed fixture value makes the replay fail. 4 of the 4 functions (the tails are the same code) are replayed over 1200 cases with no mismatch.'
  - Documented exclusion, not a blocker - the engine's VRAM, GPU packet, file and allocator calls are seams reported by name with the arguments retail passed; the two 16-bit variants index the palette with a signed byte, so the probe keeps their indices below 0x80 (a higher index reads stack leftovers in retail).
