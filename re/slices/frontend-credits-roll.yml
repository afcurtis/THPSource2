completion:
  - 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the credits group): the retail function is called on a random legal state built in a scratch slab, its virtual methods and every service outside the file stubbed (fake vtables whose slots are retail functions nothing here reaches, one per method, so each call is a named service carrying the object; some cases use the real vtables so the native dispatch runs the toolkit''s own methods); the return value, every written byte and the ordered service calls are compared with the native replay (`menu_retail_calls_test.cpp`), and a changed fixture value makes the replay fail. The credits roll''s manager (text loading and parsing, the timeline and the record updates), its three record classes and the static fonts: 29 of the 29 functions are replayed over 1160 cases with no mismatch.'
  - Documented exclusion, not a blocker - the roll's loop (Credits_Run, in `frontend-screen-loops`) keeps its manager in its own stack frame.
