completion:
- 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the groups psxs of math_specs.py): the probe makes a legal state in the game''s own globals and a scratch slab, calls the retail function, and records the return value, every written byte and the ordered service calls; the native replay (`math_retail_calls_test.cpp`) starts from the same bytes and compares all three, and a changed fixture value makes it fail. 87 of the 87 functions (the PlayStation library calls the PC build leaves empty or answers with a constant (return the argument, return zero, nothing), the draw-area primitive and terminator initialisers, the CLUT loads and the three memory card state calls, and the empty utility functions) are replayed over 2740 cases with no mismatch (at least 8 cases each; the committed fixtures keep the first 30 of each capture per function, 850 cases, which replay with no mismatch too).'
- Documented exclusion, not a blocker - the LoadImage stub the CLUT loads call is itself one of the zero-return stubs (the port inlines it).
