completion:
  - 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the psxmat, psxreg, psxq, psxbits, psxanim, psxtex and psxsave groups): the probe replaces the region table, material hash table, queue and environment list with a made-up legal world in a scratch slab, pokes a random state per case, calls the retail function and records the return value, every written byte and the ordered service calls (assertion, allocator, Mem_Delete, file layer, texture and palette services, the region parser); the native replay (`psx_spool_retail_calls_test.cpp`) starts from the same bytes and compares all three, and a changed fixture value makes it fail. 45 of the 45 functions are replayed over 3759 cases with no mismatch.'
  - 'Documented exclusion, not a blocker - the region parser (PSX_ParseEnvironment, a separate native model) is a seam: the probe''s stub publishes the words of a block kept in the image and the replay''s parse hook does the same; the rectangle words PSX_LoadTextureReferences builds from an uninitialised local are not compared; cases whose retail run faults (a null raw image after a failed assertion) are not part of the corpus.'
