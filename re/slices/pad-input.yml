- 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the groups padc of platform_specs*.py): the probe makes a legal state in the game''s own globals and a scratch slab, calls the retail function, and records the return value, every written byte and the ordered service calls; the native replay (`platform_retail_calls_test.cpp`) starts from the same bytes and compares all three, and a changed fixture value makes it fail. 13 of the 13 functions (the pad layer (pad.cpp): the one-time set-up, the clears, the rumble motors, the action record counters, the analog scaling, the frame''s input update and the player-side shuffles) are replayed over 3900 cases with no mismatch (at least 300 cases each; the committed fixtures keep the first 30 of each capture per function, 390 cases, which replay with no mismatch too).'
- Documented exclusion, not a blocker - the PSX pad library, the HAL's rumble, the DirectInput poll and the attract-mode timer reset are services with scripted answers.
