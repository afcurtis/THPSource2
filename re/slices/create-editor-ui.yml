completion:
  - 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the crui, crsave, crstat, credit and crloop groups): the retail function is called on a random legal state built in a scratch slab, its virtual methods and every service outside the file stubbed (fake vtables whose slots are retail functions nothing here reaches, one per method, so each call is a named service carrying the object); the return value, every written byte and the ordered service calls are compared with the native replay (`create_screens_retail_calls_test.cpp`), and a changed fixture value makes the replay fail. 55 of the 55 functions are replayed over 2072 cases with no mismatch, assertion paths included where retail survives them.'
  - Documented exclusion, not a blocker - the pages of 4.10d (personal, appearance and stat pages' polls, loads and updates), the trick-list window, the memory-card screen and the engine's model, spool, sprite and render calls are seams reported by name with the arguments retail passed; the three screen loops are replayed with their window's step, update, draw and deleting destructor as seams (those methods are replayed on their own), because the window base reports a child's virtual calls as services where a window built by retail holds real children.
