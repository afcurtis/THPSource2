- 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the groups mmu): the probe makes a legal state in the game''s own globals and a scratch slab, calls the retail function, and records the return value, every written byte and the ordered service calls; the native replay (mmu_retail_calls_test.cpp) starts from the same bytes and compares all three, and a changed fixture value makes it fail. 8 of the 8 functions (the card operations: the directory scan with its type filter and header reads, the card library result mapping, the readiness check, the delete, the 0x200-byte SC header, the buffer registration and the save and load of a file through the backend) are replayed over 2100 cases with no mismatch (at least 120 cases each; the committed fixtures keep the first 30 of each capture per function, 240 cases, which replay with no mismatch too).'
- Documented exclusion, not a blocker - `Mmu_SaveFile` with a type other than 1..3 builds its file name and description from uninitialised locals (the probe never asks), and `Mmu_SaveFile` / `Mmu_LoadFile` with no registered buffer return an uninitialised flag (neither is generated).
