completion:
- 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the groups cmat, cpart, capp, cskt, cweld): the probe makes a legal state in the game''s own globals and a scratch slab, calls the retail function, and records the return value, every written byte and the ordered service calls; the native replay (createobj_retail_calls_test.cpp) starts from the same bytes and compares all three, and a changed fixture value makes it fail. 28 of the 28 functions (the part database (constructor, the part manifest reader, the animation indexes, the material checksum lists, deleting destructor and destructor) and the custom skater object (constructor, destructors, the board checksum, the release of the part database, the region it builds in, its texture names and part order, the stitching of its parts, the scale, and the application of texture sets to the nine slots of the body)) are replayed over 1280 cases with no mismatch (at least 20 cases each; the committed fixtures keep the first 30 of each capture per function, 690 cases, which replay with no mismatch too).'
- Documented exclusion, not a blocker - the PSX region services, the file system's sub-directory, the texture-set lookups, the palette functions of the slots and the material queries are reported services; the lookups and records they use are earlier slices.
