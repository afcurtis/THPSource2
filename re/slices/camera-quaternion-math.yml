completion:
- 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the groups cmq): the probe makes a legal state in the game''s own globals and a scratch slab, calls the retail function, and records the return value, every written byte and the ordered service calls; the native replay (camera_retail_calls_test.cpp) starts from the same bytes and compares all three, and a changed fixture value makes it fail. 9 of the 9 functions (the camera''s quaternion math in Q12: the product, the turn about an axis or a rotation vector, the conversion to and from a rotation matrix, the spherical interpolation and the shortest turn between two angles) are replayed over 3600 cases with no mismatch (at least 400 cases each; the committed fixtures keep the first 30 of each capture per function, 270 cases, which replay with no mismatch too).'
- Documented exclusion, not a blocker - the sine and cosine are the port's x87 emulation; the near-opposite branch of the interpolation (`dot + 0x1000 < 0x81`) is unreachable, because the shorter way round is taken first and leaves a dot product of at least 0; a division fault in retail is refused by the port.
