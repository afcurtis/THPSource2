completion:
  - 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the skpers, skapp and skstat group): the retail function is called on a random legal state built in a scratch slab, its virtual methods and every service outside the file stubbed (fake vtables whose slots are retail functions nothing here reaches, one per method, so each call is a named service carrying the object); the return value, every written byte and the ordered service calls are compared with the native replay (`skater_windows_retail_calls_test.cpp`), and a changed fixture value makes the replay fail. The create-a-skater personal-information page (perwin.cpp), appearance page (appwin.cpp) and stat page with its points block (statwin.cpp): 35 of the 35 functions are replayed over 1476 cases with no mismatch, assertion paths included. The toolkit, the 4.8 skater manager and career code and the 4.9 texture-set and palette code run natively on the same memory, so the replay compares real native state changes.'
  - Documented exclusion, not a blocker - the pages' constructors and destructors of the personal and stat windows are creedit.cpp / statedit.cpp (4.10e); lists, dialogs, sprites and the engine's per-frame hook are seams reported by name; `Career_GetPointCost` (0x00415820) is the toolkit's `option_limit` service in the probe (it is validated by the 4.8 replay).
