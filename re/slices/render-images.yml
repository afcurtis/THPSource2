- 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the groups rim): the probe makes a legal state in the game''s own globals and a scratch slab, calls the retail function, and records the return value, every written byte and the ordered service calls; the native replay (render_retail_calls_test.cpp) starts from the same bytes and compares all three, and a changed fixture value makes it fail. 41 of the 41 functions (the screen image classes: the base image object, the flat and rectangle primitives, the BMP depth and palette loaders, the sliced, raw and bitmap images and the sprite (constructors, deleting destructors, drawing and size queries), the loading of a BMP into a material''s texture, the release of a region''s textures and the fill of a material''s palette) are replayed over 1640 cases with no mismatch (at least 40 cases each; the committed fixtures keep the first 30 of each capture per function, 1230 cases, which replay with no mismatch too).'
- Documented exclusion, not a blocker - the file loader, the PSX library's primitives, the texture layer and the allocator are services; a BMP header is a scripted 0x40-byte read.
