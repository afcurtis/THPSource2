completion:
  - 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the levwin, levban, levglobe, levname, levmenu and levloop groups: objects built by hand in a scratch slab with fake pool objects whose virtual methods are reported services, constructors run for real in the arena): the retail function is called on a random legal state; the return value, every written byte and the ordered service calls are compared with the native replay (`select_screens_retail_calls_test.cpp`), and a changed fixture value makes the replay fail. 33 of the 33 functions are replayed over 2250 cases with no mismatch, assertion paths included.'
  - Documented exclusion, not a blocker - the engine's sprite, sound, card, model and prompt calls and the screen loop's window methods are seams reported by name with the arguments retail passed; the loop's frame waits for the clock with a spin a forced call cannot satisfy, so it is replayed on frames that end at once (the unit tests cover the rest).
