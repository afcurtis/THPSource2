completion:
- 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the groups of editor_specs*.py): the probe makes a legal state in a scratch slab and the game''s own globals, calls the retail function, and records the return value, every written byte and the ordered service calls; the native replay (`level_editor_retail_calls_test.cpp`) starts from the same bytes and compares all three, and a changed fixture value makes it fail. 24 of the 24 functions (the editor cursor: the element arrays, the piece in hand, moving, turning, placing and removing pieces and items, the base indicator and its drawing) are replayed over 7668 cases with no mismatch (at least 100 cases each; the committed fixtures keep the first 30 of each capture per function, 1020 cases, which replay with no mismatch too).'
- Documented exclusion, not a blocker - the park generator's operations (4.11c), the piece tables (4.11b), the budgets, sine and cosine and the renderer are services with scripted results; the pieces are made-up objects.
