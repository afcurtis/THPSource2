- 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the groups gte of math_specs.py): the probe makes a legal state in the game''s own globals and a scratch slab, calls the retail function, and records the return value, every written byte and the ordered service calls; the native replay (`math_retail_calls_test.cpp`) starts from the same bytes and compares all three, and a changed fixture value makes it fail. 33 of the 33 functions (the GTE operations of the PC build that multiply a matrix by a vector and clamp (the rotation, light and colour matrices against V0 / V1 / V2 / IR, with and without the translation or background, shifted or not), the two clamps, the outer product, the square, the screen triangle area, the leading-bit count, the Z average and the mvmva dispatcher) are replayed over 9900 cases with no mismatch (at least 300 cases each; the committed fixtures keep the first 30 of each capture per function, 990 cases, which replay with no mismatch too).'
- Documented exclusion, not a blocker - the registers' meaning beyond what the ops observe (flag registers do not exist in the PC emulation), and the retail code's endless loop on `gte_ldlzc(0)`, which the probe never calls and the port leaves with LZCR cleared.
