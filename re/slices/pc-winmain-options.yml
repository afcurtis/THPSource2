completion:
- 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the groups winm, vopt of platform_specs*.py): the probe makes a legal state in the game''s own globals and a scratch slab, calls the retail function, and records the return value, every written byte and the ordered service calls; the native replay (`platform_retail_calls_test.cpp`) starts from the same bytes and compares all three, and a changed fixture value makes it fail. 12 of the 12 functions (the game side of winmain: the mode check, the screen size, the install paths, loading and saving the options file with its VIDEO section (renderer, resolution, gamma, quality, fog scale), the display mode list, the shutdown order and the device description log) are replayed over 1950 cases with no mismatch (at least 150 cases each; the committed fixtures keep the first 30 of each capture per function, 360 cases, which replay with no mismatch too).'
- Documented exclusion, not a blocker - the options file, fopen / fclose, the net layer's shutdown, the timer, the input, the movie and Direct3D shutdown calls and DirectDraw's mode enumeration are services; the fog scale and its percentage are float math at the 53-bit precision the forced calls run at.
