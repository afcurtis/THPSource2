- 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the groups mmu): the probe makes a legal state in the game''s own globals and a scratch slab, calls the retail function, and records the return value, every written byte and the ordered service calls; the native replay (mmu_retail_calls_test.cpp) starts from the same bytes and compares all three, and a changed fixture value makes it fail. 20 of the 20 functions (the screen''s flags and result, the buffer registration, the card library start and stop, the six set-up functions (career, replay and park saves and loads), the screen''s per-frame entry points and the finalising of a screen (a loaded career or replay is handed to the game)) are replayed over 2000 cases with no mismatch (at least 100 cases each; the committed fixtures keep the first 30 of each capture per function, 600 cases, which replay with no mismatch too).'
- Documented exclusion, not a blocker - the screen's constructor and destructor are services here (the screen is the `save-card-screen` slice); a null `MmuManager` is only asserted, never reached by the generated states.
