completion:
  - 'Retail forced calls in the running game (a level loaded, `re/gdb/probes/frontend_calls.py` with the menu group): the retail function is called on a random legal state built in a scratch slab, its virtual methods and every service outside the file stubbed (fake vtables whose slots are retail functions nothing here reaches, one per method, so each call is a named service carrying the object; some cases use the real vtables so the native dispatch runs the toolkit''s own methods); the return value, every written byte and the ordered service calls are compared with the native replay (`menu_retail_calls_test.cpp`), and a changed fixture value makes the replay fail. The toolkit of menu.cpp: controls and the style object, text items, rows, dots, sliders, scaled text, lists, scrolling lists, grids, the name entry keyboard, the wrapper and the static initialisers: 96 of the 96 functions are replayed over 2768 cases with no mismatch, assertion paths included.'
  - Documented exclusion, not a blocker - sprites, fonts, the engine's rectangle fills and the pad edge scan are seams reported by name (a draw is a reported call carrying the object), so what each draw looks like is the text layer's and the engine's validation; strings of 32 characters or more overrun the item and are not generated (retail corrupts the item's style pointer), nor are lists with no selectable child (the layout searches for ever) or a highlight request for an id that is not there (retail calls through the next field).
