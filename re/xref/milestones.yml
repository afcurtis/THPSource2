# Sub-milestone ownership of the in-scope functions (4.12 Cartography). `tony xref coverage` sizes each
# sub-milestone from this file: functions without a native reconstruction, retail bytes, and the number of
# sessions at the 4.10 ceiling (about 28 KB or 65 functions). A function belongs to the first matching
# `ranges` row, else to the sub-milestone that lists its source unit (`re/xref/source-units.yml`,
# `re/xref/attribution.yml`). Out-of-scope functions (`re/symbols/scope.yml`) belong to none.
# The unit lists follow docs/phases/PHASE_4_SUMMARY.md; ranges override them, and the rows after the hand-written
# ones place functions no source file claims by their neighbours (the reason says how).
version: 1

