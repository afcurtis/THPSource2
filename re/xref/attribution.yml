# Source-file attribution for functions with no assert path (4.12 Cartography). `tony xref coverage` reads
# this after re/xref/source-units.yml and the PSX unit matches; neither of those is changed by it.
#
# Two sections, same row shape: every function whose address lies in [first, last] gets `unit`.
#   reviewed:   hand-checked rows. They win over `generated`, and `scripts/neighbour_scan.py --write-attribution`
#               never touches them. Give `basis` and `note` (what you read).
#   generated:  rewritten by `python scripts/neighbour_scan.py --write-attribution` from the unattributed runs:
#     interior  both neighbours are the same file (MSVC emits an object's functions contiguously);
#     layout    a run between two files, split where the callers and the data statics (a static is shared
#               only by one object's functions, laid out in object order) point from one file to the other;
#               margin = votes separating the chosen split from the next best. On a hold-out of 64 known file
#               boundaries (an attributed window hidden, then re-derived) the layout split was right 60 times (94%):
#               treat it as a hint that the first task of the porting session (walk the range in the objdump)
#               confirms, like the Ghidra function boundaries it already corrects.
#   Functions the evidence cannot place stay unattributed; `re/xref/milestones.yml` assigns them to a
#   sub-milestone by address range instead.
# A `unit` starting with `~` names a library or area, not a Neversoft source file.
