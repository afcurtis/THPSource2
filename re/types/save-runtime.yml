version: 1
types:
  - name: RuntimeMmuSaveManager
    kind: fixed_layout
    size: 0xb4c
    confidence: confirmed
    description: The card manager (Mmu_* 0x00473d20..0x00476200), a sub-object at +0x1f8 of the 0xdd0-byte RuntimeMmuScreen. It lists the THPS2_*.SAV files of the card directory, hands out the registered save buffers and moves them through the libcard emulation. The 15th file record's last word (+0x90) is the first file type word (the scan clears the records, then writes the types); nothing reads that word as a record field.
    fields:
      - offset: 0x00
        name: vtable
        type: pointer<void>
        confidence: confirmed
        description: "vtable 0x005192e4 once constructed; 0x005184b4 (the base class) after Mmu_ResetVtable"
        evidence:
          - re/evidence/functions/save-runtime.md
      - offset: 0x04
        name: file_records
        type: array<RuntimeMmuFileRecord,15>
        overlay_group: record_tail
        confidence: confirmed
        description: The 15 records the directory scan fills (stride 0x94, the card holds 15 blocks); the active count is file_count.
        evidence:
          - re/evidence/functions/save-runtime.md
      - offset: 0x8b0
        name: file_types
        type: array<i32,15>
        overlay_group: record_tail
        confidence: confirmed
        description: "Runtime file type values: 1 career, 2 replay, 3 custom park, 4 other."
        evidence:
          - re/evidence/functions/save-runtime.md
      - offset: 0x928
        name: display_names
        type: array<RuntimeMmuDisplayName,15>
        confidence: confirmed
        description: User-facing names read back from the 0x200-byte file headers (0x21 bytes each).
        evidence:
          - re/evidence/functions/save-runtime.md
      - offset: 0xb18
        name: file_count
        type: i32
        confidence: confirmed
        evidence:
          - re/evidence/functions/save-runtime.md
      - offset: 0xb1c
        name: card_state
        type: i32
        confidence: confirmed
        description: "Card-ready/state word checked before scan, read, and write operations (0 ready; 1, 3 and 4 not)."
        evidence:
          - re/evidence/functions/save-runtime.md
      - offset: 0xb20
        name: free_card_blocks
        type: i32
        confidence: confirmed
        description: Remaining 8192-byte blocks computed from the 15-block card capacity and the discovered file sizes.
        evidence:
          - re/evidence/functions/save-runtime.md
      - offset: 0xb28
        name: save_buffer_count
        type: i32
        confidence: confirmed
        description: Number of caller-registered save buffers; the save path accepts at most four.
        evidence:
          - re/evidence/functions/save-runtime.md
      - offset: 0xb2c
        name: save_buffer_pointers
        type: array<pointer<void>,4>
        confidence: confirmed
        evidence:
          - re/evidence/functions/save-runtime.md
      - offset: 0xb3c
        name: save_buffer_sizes
        type: array<u32,4>
        confidence: confirmed
        description: Registered buffer sizes; each must be a multiple of 128 bytes.
        evidence:
          - re/evidence/functions/save-runtime.md

  - name: RuntimeMmuFileRecord
    kind: fixed_layout
    size: 0x94
    confidence: confirmed
    description: One directory entry of the card library emulation (the PC build keeps the PlayStation DIRENTRY shape with a 128-byte name). Mmu_ScanDirectory (0x004e8d40) fills it and chains the records; the Kit reads the name and the size.
    fields:
      - offset: 0x00
        name: file_name
        type: array<char,128>
        confidence: confirmed
        description: The file name the directory scan copied (strncpy of 0x80 bytes, zero padded).
        evidence:
          - re/evidence/functions/save-runtime.md
      - offset: 0x84
        name: file_size
        type: u32
        confidence: confirmed
        description: "The scan stores 0x2000 here (one card block); the manager sums it for free_card_blocks and the replay load checks it for 3 or 6 blocks."
        evidence:
          - re/evidence/functions/save-runtime.md
      - offset: 0x88
        name: next_record
        type: pointer<RuntimeMmuFileRecord>
        confidence: confirmed
        description: The scan links record i to record i + 1 and clears the last one.
        evidence:
          - re/evidence/functions/save-runtime.md

  - name: RuntimeMmuDisplayName
    kind: fixed_layout
    size: 0x21
    confidence: confirmed
    description: One display name of the card manager, a 32-character string with its terminator.
    fields:
      - offset: 0x00
        name: text
        type: array<char,33>
        confidence: confirmed
        evidence:
          - re/evidence/functions/save-runtime.md

  - name: RuntimeMmuScreen
    kind: fixed_layout
    size: 0xdd0
    confidence: observed
    description: The save-card screen (Mmu_Screen* 0x00476b00..0x00479f60), the global MmuManager at 0x0056ad00; a window (0xac bytes) with a Font object, the card manager and the screen's widgets and state. Vtable 0x00519308.
    fields:
      - offset: 0x00
        name: vtable
        type: pointer<void>
        confidence: confirmed
        evidence:
          - re/evidence/functions/save-runtime.md
          - re/evidence/functions/front-screens.md
      - offset: 0xac
        name: font
        type: RuntimeFont
        confidence: confirmed
        description: A copy of the s2tricks.fnt Font object (0x14c bytes), the screen text font.
        evidence:
