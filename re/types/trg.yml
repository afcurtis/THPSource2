      - offset: 0x6a
        name: trigger_state_flags
        type: u16
        confidence: observed
        evidence:
          - re/evidence/functions/trg-runtime.md
      - offset: 0x70
        name: script_scalar_value
        type: u32
        confidence: confirmed
        description: Value written by base script opcode 0x4280 after virtual-operand resolution; non-state-1 objects receive a 12-bit fixed-point shift.
        evidence:
          - re/evidence/functions/trg-runtime.md
      - offset: 0xae
        name: constructor_cleared_word
        type: u16
        confidence: confirmed
        description: Constructor clears this word before later object-family setup.
        evidence:
