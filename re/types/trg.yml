      - offset: 0xc8
        name: list_identifier
        type: u16
        confidence: observed
        description: Identifier used by the 0x83/0x84 object-flag command space.
        evidence:
          - re/evidence/functions/trg-runtime.md
      - offset: 0x68
        name: field_68
        type: u16
        confidence: observed
        description: "Read or written by the world Kit's script-object methods; the meaning is not recovered."
        evidence:
          - re/evidence/functions/world-script-baddy.md

  - name: RuntimeTriggerRailRecord
    kind: fixed_layout
    size: 0x28
    confidence: observed
    description: >-
      The CRail runtime record (a CClass_OpNew(0x28) object on an intrusive list headed at 0x0056b860), made by the CRail constructor 0x004aa8c0 from the type-10 rail-point and type-11 rail-definition
      nodes of one chain: its state and kind come from the first node's trigger word, and its bounding box is the box of the chain's node positions.
    fields:
      - offset: 0x00
        name: vtable
        type: pointer<void>
        confidence: confirmed
        description: 0x005196a4 while live (slot 0 is 0x004aaf10, the destructor); 0x005184b4 once CRail_destroy has run.
        evidence:
          - re/evidence/functions/rail-creation.md
          - re/evidence/functions/rail-nodes.md
      - offset: 0x04
        name: rail_state
        type: u8
        confidence: confirmed
        description: Set to one by the pulse path and zero by the kill path; the constructor starts it at 0 when bit 6 of the first node's trigger word is set, else 1.
        evidence:
          - re/evidence/functions/trg-runtime.md
          - re/evidence/functions/rail-creation.md
      - offset: 0x05
        name: rail_kind
        type: u8
        confidence: confirmed
        description: The low four bits of the first node's trigger word.
        evidence:
          - re/evidence/functions/rail-creation.md
      - offset: 0x06
        name: source_trg_node_index
        type: u16
        confidence: confirmed
        description: The first node of the chain.
        evidence:
          - re/evidence/functions/trg-runtime.md
          - re/evidence/functions/rail-creation.md
      - offset: 0x08
        name: bounds_minimum
        type: RuntimeIntVector3
        confidence: confirmed
        description: Bounding box of the chain's node positions, low corner (starts at 0x7fffffff).
        evidence:
          - re/evidence/functions/rail-creation.md
      - offset: 0x14
        name: bounds_maximum
        type: RuntimeIntVector3
        confidence: confirmed
        description: Bounding box of the chain's node positions, high corner (starts at 0x80000000).
        evidence:
          - re/evidence/functions/rail-creation.md
      - offset: 0x20
        name: previous_rail_record
        type: pointer<RuntimeTriggerRailRecord>
        confidence: confirmed
        evidence:
          - re/evidence/functions/rail-creation.md
          - re/evidence/functions/rail-nodes.md
      - offset: 0x24
        name: next_rail_record
        type: pointer<RuntimeTriggerRailRecord>
        confidence: observed
        evidence:
          - re/evidence/functions/trg-runtime.md
          - re/evidence/functions/rail-nodes.md

  - name: RuntimeRailLookupEntry
    kind: fixed_layout
    size: 0x04
    confidence: confirmed
    description: >-
      An entry of the rail lookup table SetupLookup 0x004aa4b0 builds (2000 entries at the pointer 0x0056b858, freed at the end of Rail_CreateRails; entry 0 is not a rail): the rail node the entry
      stands for, and the index of the entry whose rail continues at it (0: none).
    fields:
      - offset: 0x00
        name: node
        type: u16
        confidence: confirmed
        evidence:
          - re/evidence/functions/rail-nodes.md
      - offset: 0x02
        name: leads_from
        type: u16
        confidence: confirmed
        evidence:
          - re/evidence/functions/rail-nodes.md

  - name: RuntimeCameraPointRegistry
    kind: fixed_layout
    size: 0x90
    confidence: observed
    description: "Global type-13 TRG camera-point registry: 70 u16 node indices followed by the active count word."
    fields:
      - offset: 0x00
        name: node_indices
        type: array<u16,70>
        confidence: observed
        description: Registered source TRG node indices; the first-pass camera-point handler appends one index per type-13 node.
        evidence:
          - re/evidence/functions/trg-runtime.md
      - offset: 0x8c
        name: count
        type: u32
        confidence: observed
        description: Active entry count, bounded below 0x46.
        evidence:
          - re/evidence/functions/trg-runtime.md

  - name: RuntimeCameraPointPayload
    kind: fixed_layout
    size: null
    confidence: observed
    description: Decoded payload immediately following a type-13 camera-point position; the two words are consumed by camera selection with public names still open.
    fields:
      - offset: 0x00
        name: selection_state_word
        type: u16
        confidence: observed
        description: Value one selects the camera state bit 0x400; other values select bit 0x800 in the nearest-point consumer.
        evidence:
          - re/evidence/functions/trg-runtime.md
      - offset: 0x02
        name: transition_variant
        type: u16
        confidence: observed
        description: Retained by the camera transition path as the selected point's raw variant value.
        evidence:
          - re/evidence/functions/trg-runtime.md

  - name: RuntimeLevelEventState
    kind: variable_record
    confidence: observed
    description: Scattered level-event globals and their raw mode-8/mode-9 counter words used by TRG command 0x009e; these are not one contiguous retail allocation.
    fields:
      - offset: global
        name: level_event_state_word
        type: u32
        confidence: confirmed
        description: Global at 0x00568610 initialized to 0x40 and cleared when the pending-score branch re-arms the event.
        evidence:
          - re/evidence/functions/level-event-runtime.md
      - offset: global
        name: level_event_latch
        type: u8
        confidence: confirmed
        description: Global at 0x00568658; set on first event dispatch and cleared by the no-pending-score completion path.
        evidence:
          - re/evidence/functions/level-event-runtime.md
      - offset: global
        name: level_event_countdown
        type: u32
        confidence: confirmed
        description: Global at 0x00568818; initialized to 0x50, decremented once per eligible gameplay frame, and re-armed to one for a pending-score retry.
        evidence:
          - re/evidence/functions/level-event-runtime.md
      - offset: global
        name: level_event_flag
        type: u8
        confidence: confirmed
        description: Byte at 0x006a3d49; set after the mode-dependent initialization branch and used to suppress that branch on later dispatches.
        evidence:
          - re/evidence/functions/level-event-runtime.md
      - offset: global
        name: raw_word_0056b798
        type: i32
        confidence: observed
        description: Incremented by the less-specific mode-8 comparison branch and one mode-9 side branch.
        evidence:
          - re/evidence/functions/level-event-runtime.md
      - offset: global
        name: raw_word_0056b79c
        type: i32
        confidence: observed
        description: Incremented by the complementary mode-8 comparison branch and one mode-9 side branch.
        evidence:
          - re/evidence/functions/level-event-runtime.md
      - offset: global
        name: raw_word_0056b7a0
        type: i32
        confidence: observed
        description: Maximum-tracking word updated from the secondary player +0x2cdc comparison value.
        evidence:
          - re/evidence/functions/level-event-runtime.md
      - offset: global
        name: raw_word_0056b7a4
        type: i32
        confidence: observed
        description: Maximum-tracking word updated from the primary player +0x2cdc comparison value.
        evidence:
          - re/evidence/functions/level-event-runtime.md
      - offset: global
        name: raw_word_0056b7b0
        type: i32
        confidence: observed
        evidence:
          - re/evidence/functions/level-event-runtime.md
      - offset: global
        name: raw_word_0056b7b4
        type: i32
        confidence: observed
        evidence:
          - re/evidence/functions/level-event-runtime.md
      - offset: global
        name: raw_word_0056b7dc
        type: i32
        confidence: observed
        description: Incremented by the complementary mode-8 comparison branch and one mode-9 side branch.
        evidence:
          - re/evidence/functions/level-event-runtime.md
      - offset: global
