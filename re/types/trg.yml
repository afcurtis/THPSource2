        type: u16
        confidence: observed
        evidence:
          - re/evidence/functions/trg-runtime.md
      - offset: 0x1a
        name: resolved_key_value
        type: u16
        confidence: confirmed
        description: Result written after resolving the aligned u32 command key through the PSX model/checksum lookup helper.
        evidence:
          - re/evidence/functions/trg-runtime.md
      - offset: 0x20
        name: next_object
        type: pointer<RuntimeTriggerScriptObject0xab>
        confidence: confirmed
        evidence:
