types:
  - name: RuntimeTriggerObjectHeader
    kind: fixed_layout
    size: null
    confidence: observed
    description: Common fields observed on objects created by the TRG factory. This is separate from RuntimePsxObjectRecord.
    fields:
      - offset: 0x08
        name: position_x_fixed
        type: i32
        confidence: confirmed
        description: 12-bit fixed-point world position; Warehouse node 17 matches its disk position shifted left by 12.
        evidence:
          - re/evidence/functions/trg-runtime.md
      - offset: 0x0c
        name: position_y_fixed
        type: i32
        confidence: confirmed
        evidence:
          - re/evidence/functions/trg-runtime.md
      - offset: 0x10
        name: position_z_fixed
        type: i32
        confidence: confirmed
        evidence:
          - re/evidence/functions/trg-runtime.md
      - offset: 0x04
        name: object_flags
