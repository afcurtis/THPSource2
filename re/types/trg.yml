  - name: RuntimeTriggerLinkRecord
    kind: fixed_layout
    size: 0x18
    confidence: confirmed
    description: Small link record allocated for crate/command-point style TRG relationships.
    fields:
      - offset: 0x00
        name: command_stream_or_diagnostic_payload
        type: pointer<void>
        confidence: confirmed
        description: Type-6 records point at a trailing u16 command stream; the type-2 path supplies a static diagnostic string pointer instead.
        evidence:
          - re/evidence/functions/trg-runtime.md
      - offset: 0x04
        name: state_byte_0
        type: u8
        confidence: confirmed
        evidence:
          - re/evidence/functions/trg-runtime.md
      - offset: 0x05
        name: state_byte_1
        type: u8
        confidence: confirmed
        evidence:
          - re/evidence/functions/trg-runtime.md
      - offset: 0x06
        name: initial_pulse_byte
        type: u8
        confidence: confirmed
        evidence:
          - re/evidence/functions/trg-runtime.md
      - offset: 0x07
        name: pulse_count_or_state
        type: u8
        confidence: observed
        description: Incremented by the type-6 pulse path; also compared by command 0x94.
        evidence:
          - re/evidence/functions/trg-runtime.md
      - offset: 0x08
        name: pulse_limit_or_state_word
        type: i16
        confidence: confirmed
        description: Command 0x0003 gates source-list execution on this word and decrements it unless it is -1; its initial constructor value is zero.
        evidence:
          - re/evidence/functions/trg-runtime.md
      - offset: 0x0a
        name: source_trg_node_index
        type: u16
        confidence: confirmed
        evidence:
          - re/evidence/functions/trg-runtime.md
      - offset: 0x0c
        name: target_value
        type: u32
        confidence: confirmed
        evidence:
          - re/evidence/functions/trg-runtime.md
      - offset: 0x10
        name: next_global_link
        type: pointer<RuntimeTriggerLinkRecord>
        confidence: confirmed
        evidence:
          - re/evidence/functions/trg-runtime.md
      - offset: 0x14
        name: next_target_bucket
        type: pointer<RuntimeTriggerLinkRecord>
        confidence: confirmed
        evidence:
          - re/evidence/functions/trg-runtime.md

  - name: RuntimeTriggerScriptObject0xab
    kind: fixed_layout
    size: 0xcc
    confidence: observed
    description: Runtime record allocated by trigger opcode 0x00ab. The constructor fields are separated from the command's three raw trailing words.
    fields:
      - offset: 0x00
