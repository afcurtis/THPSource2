  - name: RuntimeEquipDeckItem
    kind: fixed_layout
    size: 0x28
    confidence: observed
    description: "A deck's picture (DeckItem, 0x00447ae0..0x00447cf0): the spooled data, the file name, the load and swap flags, the texture set it replaces."
    fields:
      - offset: 0x00
        name: near_priority
        type: i8
        confidence: observed
        description: "Distance from the front in decks (the smaller of the two ways round); the spool orders by this plus twice the next byte."
        evidence:
          - re/evidence/functions/equipment-select-screen.md
      - offset: 0x01
        name: set_priority
        type: i8
        confidence: observed
        description: "Distance from the shown set in sets."
        evidence:
          - re/evidence/functions/equipment-select-screen.md
      - offset: 0x04
        name: data
        type: pointer<void>
        confidence: observed
        description: "The spooled-in picture data (0 when not loaded)."
        evidence:
          - re/evidence/functions/equipment-select-screen.md
      - offset: 0x08
        name: file_name
        type: array<char,16>
        confidence: observed
        description: "The deck's picture file name."
        evidence:
          - re/evidence/functions/equipment-select-screen.md
      - offset: 0x18
        name: data_held
        type: u8
        confidence: observed
        description: "1 while the loaded data is in memory."
        evidence:
          - re/evidence/functions/equipment-select-screen.md
      - offset: 0x19
        name: held_back
        type: u8
        confidence: observed
        description: "1 for a deck the character does not own: its picture is never swapped in."
        evidence:
          - re/evidence/functions/equipment-select-screen.md
      - offset: 0x1a
        name: wanted
        type: u8
        confidence: observed
        description: "Set by the scroll for the five decks round the front."
        evidence:
          - re/evidence/functions/equipment-select-screen.md
      - offset: 0x1b
        name: not_wanted
        type: u8
        confidence: observed
        description: "The reverse of wanted, set by the same call."
        evidence:
          - re/evidence/functions/equipment-select-screen.md
      - offset: 0x1c
        name: settled
        type: u8
        confidence: observed
        description: "Set once an update has acted on wanted."
        evidence:
          - re/evidence/functions/equipment-select-screen.md
      - offset: 0x1d
        name: picture_shown
        type: u8
        confidence: observed
        description: "1 while the loaded picture, not the placeholder, is in the texture set."
        evidence:
          - re/evidence/functions/equipment-select-screen.md
      - offset: 0x20
        name: placeholder_set
        type: pointer<void>
        confidence: observed
        description: "The texture set the placeholder picture came with."
        evidence:
          - re/evidence/functions/equipment-select-screen.md
      - offset: 0x24
        name: texture_set
        type: u32
        confidence: observed
        description: "The texture set entry the picture replaces (0x00457e10)."
        evidence:
          - re/evidence/functions/equipment-select-screen.md

