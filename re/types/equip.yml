version: 1
types:
  - name: RuntimeEquipRackBase
    kind: fixed_layout
    size: 0x14
    confidence: observed
    description: "The slide every rack of the equipment-select screen shares (RackBase, 0x004468e0..0x00446990): five words and two flag bytes."
    fields:
      - offset: 0x00
        name: vtable
        type: pointer<void>
        confidence: observed
        description: "Vtable 0x005189b4 (RackBase), 0x005189c4 (DeckRack) or 0x005189d8 (TruckRack)."
        evidence:
          - re/evidence/functions/equipment-select-screen.md
      - offset: 0x04
        name: single
        type: u8
        confidence: observed
        description: "1 when the rack has one set (or is the truck rack): up and down are refused."
        evidence:
          - re/evidence/functions/equipment-select-screen.md
      - offset: 0x06
        name: active
        type: u8
        confidence: observed
        description: "Non-zero while the rack is the page shown."
        evidence:
          - re/evidence/functions/equipment-select-screen.md
      - offset: 0x08
        name: state
        type: i32
        confidence: observed
        description: "Slide state: 0 sliding in, 1 shown, 2 sliding out, 3 hidden."
        evidence:
          - re/evidence/functions/equipment-select-screen.md
      - offset: 0x0c
        name: offset
        type: i32
        confidence: observed
        description: "Horizontal slide offset (600 off screen, 0 shown, -600 sliding out)."
        evidence:
          - re/evidence/functions/equipment-select-screen.md
      - offset: 0x10
        name: target
        type: i32
        confidence: observed
        description: "The offset the slide moves towards."
        evidence:
          - re/evidence/functions/equipment-select-screen.md

