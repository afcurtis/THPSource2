version: 1
types:
  - name: RuntimeFrontElement
    kind: fixed_layout
    size: 0x28
    confidence: confirmed
    description: The ScreenElement base of every frontend screen widget (vtable 0x005196a8 at construction); a window, a text element and a sprite element extend it. It has a target position and slides toward it each frame.
    fields:
      - offset: 0x00
        name: vtable
        type: pointer<void>
        confidence: confirmed
        evidence:
          - re/evidence/functions/frontend-window-base.md
      - offset: 0x04
        name: pad
        type: u16
        confidence: observed
        description: A half word the constructor clears (the prompt windows of the save screen write 0x80 here).
        evidence:
          - re/evidence/functions/frontend-window-base.md
      - offset: 0x08
        name: target_x
        type: i32
        confidence: confirmed
        evidence:
          - re/evidence/functions/frontend-window-base.md
      - offset: 0x0c
        name: target_y
        type: i32
        confidence: confirmed
        evidence:
          - re/evidence/functions/frontend-window-base.md
      - offset: 0x10
        name: argument
        type: u32
        confidence: confirmed
        description: The draw argument the element passes on.
        evidence:
          - re/evidence/functions/frontend-window-base.md
      - offset: 0x14
        name: hidden
        type: u32
        confidence: confirmed
        description: Non-zero hides the element.
        evidence:
          - re/evidence/functions/frontend-window-base.md
      - offset: 0x18
        name: delay
        type: i32
        confidence: confirmed
        description: Frames to wait before the slide starts.
        evidence:
          - re/evidence/functions/frontend-window-base.md
      - offset: 0x1c
        name: arrived
        type: u8
        confidence: confirmed
        description: 1 once the element is at its target.
        evidence:
          - re/evidence/functions/frontend-window-base.md
      - offset: 0x20
        name: x
        type: i32
        confidence: confirmed
        evidence:
          - re/evidence/functions/frontend-window-base.md
      - offset: 0x24
        name: y
        type: i32
        confidence: confirmed
        evidence:
          - re/evidence/functions/frontend-window-base.md

