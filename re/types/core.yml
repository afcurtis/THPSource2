  - name: RuntimeRenderState
    kind: fixed_layout
    size: null
    confidence: observed
    description: >-
      The render state the pointer at 0x00560fd4 names. The polygon helpers of main.cpp read the ordering-table pointers and the arena base; only those fields are named.
    fields:
      - offset: 0x84
        name: ordering_table
        type: u32
        confidence: observed
        description: Pointer to the ordering table the dimming quads and the screen flip use (the link of a primitive is word 2 of the table).
        evidence:
          - re/evidence/functions/core-main-loop.md
      - offset: 0x88
        name: viewport_table
        type: u32
        confidence: observed
        description: Pointer to the ordering table the viewport's quads link into (the head word is the first word).
        evidence:
          - re/evidence/functions/core-main-loop.md
      - offset: 0x8c
        name: viewport_table_alias
        type: u32
        confidence: observed
        description: Set to the table at +0x88 plus the viewport's 0x8000 offset by M3D_RenderStage.
        evidence:
          - re/evidence/functions/core-main-loop.md
      - offset: 0xb0
        name: arena_base
        type: u32
        confidence: observed
        description: The base of the polygon arena; the arena end is this plus the arena size word.
        evidence:
          - re/evidence/functions/core-main-loop.md

  - name: RuntimeScreenPrimitive
    kind: fixed_layout
    size: 0x1c
    confidence: observed
    description: >-
      A 2D screen primitive of the polygon arena (the arena cursor advances by 0x1c): the ordering-table link, a colour word (three channel bytes and the code byte at +7: 0x28 a quad, 0x2a the dimming quad), four
      vertices of two shorts each (the quad's second and third are exchanged) and the depth float (-1.0 when both ordering tables are the same table).
    fields:
      - offset: 0x00
        name: link
        type: u32
        confidence: observed
        description: The next primitive of the ordering-table bucket.
        evidence:
          - re/evidence/functions/core-main-loop.md
      - offset: 0x04
        name: colour_word
        type: u32
        overlay_group: colour
        confidence: observed
