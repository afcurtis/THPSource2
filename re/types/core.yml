  - name: RuntimeTypeTaggedListNode
    kind: fixed_layout
    size: null
    confidence: observed
    description: >-
      A member of the list at 0x0055f704 that RuntimeObject_UpdateVisibilityBounds ends with: next pointer at +8 (not +0x20), position at +0x10, a type byte at +0x3b (only type 2 is swept)
      and a result byte at +0x4a. Only the fields that sweep reads or writes are named.
    fields:
      - offset: 0x08
        name: next
        type: pointer<RuntimeTypeTaggedListNode>
        confidence: confirmed
        evidence:
          - re/evidence/functions/core-utilities.md
      - offset: 0x10
        name: position
        type: RuntimeIntVector3
        confidence: confirmed
        evidence:
          - re/evidence/functions/core-utilities.md
      - offset: 0x3b
        name: kind
        type: u8
        confidence: confirmed
        evidence:
          - re/evidence/functions/core-utilities.md
      - offset: 0x4a
        name: result_flag
        type: u8
        confidence: confirmed
        description: The sweep sets it to 1 (show) or clears it (one player).
        evidence:
          - re/evidence/functions/core-utilities.md

  - name: RuntimeViewportRecord
    kind: fixed_layout
    size: 0xa4
    confidence: observed
    description: >-
      One of the viewport records at 0x0055f7c8 (the stride is 0xa4). Utils_CalculateSpatialAttenuation reads the camera position (whole units) and the 3x3 rotation matrix of the viewport
      being drawn.
    fields:
      - offset: 0x04
        name: camera_position
        type: RuntimeIntVector3
        confidence: observed
        description: Camera position in whole world units (the attenuation shifts it left by 12 to compare with Q12 positions).
        evidence:
          - re/evidence/functions/core-utilities.md
      - offset: 0x74
        name: rotation
        type: RuntimeQ12Matrix
        confidence: observed
        description: The rotation matrix the attenuation loads into the GTE.
        evidence:
          - re/evidence/functions/core-utilities.md

  - name: RuntimeRelocatableModuleNode
    kind: fixed_layout
    size: 0x34
    confidence: confirmed
    description: A loaded relocatable module (made by RelocatableModule_LoadPair), a node of a doubly linked list whose head is the word at 0x0056b89c.
    fields:
      - offset: 0x00
        name: vtable
        type: pointer<void>
        confidence: confirmed
        description: Always 0x004ac060 (RelocatableModule_Destroy, an assertion that always fails).
        evidence:
          - re/evidence/functions/core-packages.md
      - offset: 0x04
        name: entry
        type: pointer<void>
        confidence: confirmed
        description: The loaded code block (name.bin); its first word is the entry point called with the node.
        evidence:
          - re/evidence/functions/core-packages.md
      - offset: 0x08
        name: name_hash
        type: u32
        confidence: confirmed
        evidence:
          - re/evidence/functions/core-packages.md
      - offset: 0x2c
        name: next
        type: pointer<RuntimeRelocatableModuleNode>
        confidence: confirmed
        evidence:
          - re/evidence/functions/core-packages.md
      - offset: 0x30
        name: previous
        type: pointer<RuntimeRelocatableModuleNode>
        confidence: confirmed
        evidence:
          - re/evidence/functions/core-packages.md

  - name: RuntimePkrPackageHeader
    kind: fixed_layout
    size: 0x10
    confidence: confirmed
    description: The 16-byte header PKR_PreLoad reads from the package stream.
    fields:
      - offset: 0x00
        name: signature
        type: u32
        confidence: confirmed
        description: "'PKR2' (0x32524b50)."
        evidence:
          - re/evidence/functions/core-packages.md
      - offset: 0x08
        name: entry_count
        type: u32
        confidence: confirmed
        description: Number of 0x28-byte entries.
        evidence:
          - re/evidence/functions/core-packages.md
      - offset: 0x0c
        name: file_count
        type: u32
        confidence: confirmed
        description: Number of 0x30-byte file records (RuntimePkrFileRecord).
        evidence:
          - re/evidence/functions/core-packages.md

  - name: RuntimeBufferedStreamObject
    kind: fixed_layout
    size: null
    confidence: observed
    description: >-
      The stream object the constructor at 0x004ebf10 initialises (a vtable at 0x00519a18, a 0x2458-byte buffer area, a position word and two flag bytes). Only the words the constructor and
      destructor touch are named.
    fields:
      - offset: 0x00
        name: vtable
        type: pointer<void>
        confidence: confirmed
        description: Always 0x00519a18.
        evidence:
          - re/evidence/functions/core-packages.md
      - offset: 0x04
        name: open_state
        type: u32
        confidence: observed
        description: Nonzero makes the destructor call 0x004ebfe0 (the close).
        evidence:
          - re/evidence/functions/core-packages.md
      - offset: 0x2458
        name: position_marker
        type: i32
        confidence: observed
        description: The constructor sets it to -1.
        evidence:
          - re/evidence/functions/core-packages.md
      - offset: 0x245c
        name: flag_245c
        type: u8
        confidence: observed
        evidence:
          - re/evidence/functions/core-packages.md
      - offset: 0x245d
        name: flag_245d
        type: u8
        confidence: observed
        evidence:
          - re/evidence/functions/core-packages.md

