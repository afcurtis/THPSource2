  - name: RuntimeViewportRect
    kind: fixed_layout
    size: 0x18
    confidence: observed
    description: >-
      One of the nine screen rectangles from 0x00533fa8 (stride 0x18: the whole screen, then a pair per layout). LaunchGame fills the edges from the screen size (the right half of a vertical split has
      right = width and left = width / 2); PlayAway_Init fills +0xc and Display +0xe of the first.
    fields:
      - offset: 0x00
        name: right
        type: u16
        confidence: observed
        evidence:
          - re/evidence/functions/core-main-loop.md
      - offset: 0x02
        name: bottom
        type: u16
        confidence: observed
        evidence:
          - re/evidence/functions/core-main-loop.md
      - offset: 0x04
        name: left
        type: u16
        confidence: observed
        evidence:
