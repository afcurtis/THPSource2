version: 1
types:
  - name: RuntimeListObject
    kind: fixed_layout
    size: null
    confidence: observed
    description: >-
      The head every object of the game's intrusive lists shares for the core sweeps (DeleteList, the box kill and visibility sweeps, the platform angle test, the environment-item hit):
      a vtable whose slot 0 deletes with a flag and slot 2 kills, the visibility word, the Q12 position, two angles, the model index inside the object's region, the region and the
      next pointer. Only the fields those functions read or write are named. The trigger factory's objects (RuntimeTriggerObjectHeader) are a subset of the same memory.
    fields:
      - offset: 0x00
        name: vtable
        type: pointer<void>
        confidence: confirmed
        evidence:
          - re/evidence/functions/core-utilities.md
      - offset: 0x04
        name: visibility_flags
        type: u16
        confidence: confirmed
        description: The word the visibility sweeps set (0x41, 0x01, 0x40) and clear; Init_Cleanup mode 2 clears bit 10.
        evidence:
          - re/evidence/functions/core-utilities.md
          - re/evidence/functions/core-startup.md
      - offset: 0x08
        name: position
        type: RuntimeIntVector3
        confidence: confirmed
        description: Q12 world position (x, y, z).
        evidence:
          - re/evidence/functions/core-utilities.md
      - offset: 0x14
        name: pitch_angle
        type: i16
        confidence: observed
        description: The angle CPlatform__AI compares with the pitch Camera_BuildLookAngles answers (angles[0]).
        evidence:
          - re/evidence/functions/core-utilities.md
      - offset: 0x16
        name: yaw_angle
        type: i16
        confidence: observed
        description: The angle CPlatform__AI compares with the yaw (angles[1]).
        evidence:
          - re/evidence/functions/core-utilities.md
      - offset: 0x1a
        name: model_index
        type: u16
        confidence: observed
        description: Index into the model-pointer table of the object's region (Exp_HitEnvItem).
        evidence:
          - re/evidence/functions/core-packages.md
      - offset: 0x1f
        name: region
        type: u8
        confidence: observed
        description: The region slot (stride 0x44) the object's model lives in.
        evidence:
          - re/evidence/functions/core-packages.md
      - offset: 0x20
        name: next
        type: pointer<RuntimeListObject>
        confidence: confirmed
        evidence:
          - re/evidence/functions/core-utilities.md
          - re/evidence/functions/core-startup.md
      - offset: 0x68
        name: list_flags
        type: u16
        confidence: observed
        description: Utils_FlagListObjects sets bit 2 of this word on every object whose protect byte has no bit 6.
        evidence:
          - re/evidence/functions/core-utilities.md
      - offset: 0x6a
        name: protect_flags
        type: u8
        confidence: confirmed
        description: Bit 5 keeps DeleteList from deleting the object; bit 6 keeps Utils_FlagListObjects from flagging it (and M3dColij_LineToSphere from testing it).
        evidence:
          - re/evidence/functions/core-startup.md
          - re/evidence/functions/m3d-culling-helpers.md
      - offset: 0xae
        name: bounding_radius
        type: u16
        confidence: observed
        description: The radius of the sphere M3dColij_LineToSphere tests the line against (times the caller's scale, Q12 like the position).
        evidence:
          - re/evidence/functions/m3d-culling-helpers.md
      - offset: 0x18
        name: field_18
        type: u16
        confidence: observed
        description: "Read or written by the world Kit's object base-class methods; the meaning is not recovered."
        evidence:
          - re/evidence/functions/world-object-base.md
