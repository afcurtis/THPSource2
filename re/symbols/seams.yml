# Named seams: the out-of-scope retail functions (re/symbols/scope.yml) that native code calls.
# Phase 4 completion target 2: every native call into out-of-scope code goes through a named seam,
# so the standalone link (Phase 5) can resolve each one to its replacement (the category's
# `replacement` in scope.yml). Native code passes the seam's constant to `engine(...)`, and
# tests/test_oos_seams.py fails when a native source (outside src/hooks, which are the adapters)
# uses an out-of-scope function address at all: since 5.3a native code names the seam
# (`seam::<category>::<name>`, src/runtime/seam_addresses_generated.hpp, generated from this file by
# scripts/generate_seam_addresses.py) and this registry is the only place the address lives.
#
# Only code references count (an address in a comment does not). Names come from
# re/symbols/functions.yml; where Ghidra has none, from the native source's own constant or
# comment, or `FUN_<address>`. The seam id is `<prefix>.<name>`: crt, zlib, hal, bink, net (DirectPlay).
version: 1

