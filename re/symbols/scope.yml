# Out-of-scope map for Phase 4 (4.12 Cartography; policy in docs/phases/PHASE_4_SUMMARY.md "Scope and the
# completion target"). A function listed here is replaced, not reconstructed: it is tagged with a category
# and the replacement that will stand in for it, never decompiled. `tony xref coverage` reads this file and
# reports native / in-scope. Tagging changes no `match/` status and no byte of the rebuild.
#
# Rules the map follows:
#   * A function that already has a native reconstruction is in scope by definition (the CRT_* wrappers, the
#     `d3dfunc` natives); `tony xref coverage` ignores any row for it. `keep` lists in-scope exceptions that
#     sit inside a range or a hook point.
#   * HAL hook points and the helpers they own (re/config/hal_boundary.yml, checked by `tony hal check`) are
#     replaced by the adapters in src/hooks/hal and the services behind them, except retail logic the adapters
#     call in place (bindings, action masks: re/config/native_hooks.yml `services.hal.symbols`), which stays in
#     scope. The movie hook points (the pcmovie interface the game calls) stay in scope too; their Bink bodies
#     are out.
#   * Library ranges are tagged only with evidence: `scripts/match_library_signatures.py` (byte equality with
#     VC6 LIBC.LIB/LIBCMT.LIB code, relocations masked) for the C runtime; the library's own strings and its
#     call structure for zlib; see re/evidence/xref-libraries.md.
version: 1

categories:
  crt:
    title: MSVC 6 C runtime
    replacement: "the host toolchain's C runtime (behaviour the game observes has a native equivalent: CRT_SplitPath, CRT_StrICmp, ResourceStream_*, the 24-bit x87 control word in render code)"
  zlib:
    title: zlib 1.1.2
    replacement: "upstream zlib (the PKR2_*Zlib wrappers are game code and stay in scope)"
  platform-hal:
    title: Platform API backends behind the HAL
    replacement: "the SDL3 HAL (video=sdl on SDL_GPU or GL, audio=sdl, SDL input, clock and fs services)"
  bink:
    title: Bink movie and music player
    replacement: "a HAL movie and music backend on a modern decoder (FFmpeg decodes Bink video and audio)"
  compiler-glue:
    title: Compiler-generated static-object glue
    replacement: "real C++ static constructors and destructors, run by the host toolchain's start-up code"
  directplay:
    title: DirectPlay multiplayer
    replacement: "nothing; online and LAN multiplayer are dropped from the native build"

ranges:
  - {first: 0x004f9c80, last: 0x004ffd39, category: zlib,
     note: "zlib 1.1.2: deflate and inflate, with the library's own error strings ('incorrect header check', 'buffer error', ...) and the '1.1.2' version string; PKR2 calls it"}
  - {first: 0x004ffd3a, last: 0x005122b1, category: crt,
     note: "MSVC 6 runtime to the end of .text: 371 of its functions equal LIBC.LIB or LIBCMT.LIB code with relocations masked; the unmatched ones sit between matched ones (a later service pack's variant of the same objects)"}
  - {first: 0x004ebf90, last: 0x004ed950, category: platform-hal,
     note: "SDX DirectInput wrapper (SDXInput, SDXMouse, SDXJoystick, force feedback): the input service (`input=sdl`); includes the unreferenced dead methods"}
  - {first: 0x004edbb0, last: 0x004f27b0, category: platform-hal,
     note: "SOFTREND software renderer (scanline fills, RGB565 conversion, SOFTREND_Startup at 0x004f2720): the SDL3 video backends do not implement the software path (D3DSoftwareRenderer)"}

# In-scope exceptions inside a range or a hook point.
keep:
  - {address: 0x004ec930, reason: "SDXMouse_SetBounds: no platform call; PCInput_Initialize sets the mouse clamp (0, 0, 0x260, 0x1c0) through it and the HAL input adapter calls it in place (native_hooks.yml services.hal.symbols)"}

